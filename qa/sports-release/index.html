<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HABAO 三運動正式前台驗證</title><style>
*{box-sizing:border-box}body{margin:0;background:#07131d;color:#e9f0f7;font:14px system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:22px}h1{font-size:24px;margin:0 0 12px}p{color:#b3c5d4;line-height:1.7}button,select,.upload{font:inherit;border:1px solid #496173;border-radius:9px;padding:10px 13px;background:#122736;color:#e9f0f7;cursor:pointer}button.active,button.primary{background:#edbe48;color:#101c22;border-color:#edbe48}button:disabled{opacity:.45;cursor:default}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.panel{border:1px solid #3c5366;border-radius:15px;padding:16px;margin:16px 0;background:#0b1d2a}.badge{color:#edbe48;font-weight:800}.pass{color:#6ee7b7}.fail{color:#ffaaa0}.notice{padding:12px;border-left:3px solid #edbe48;background:#1d241f}iframe{display:block;width:100%;height:1100px;border:0;background:#07131d}.framebox{margin:auto;width:100%;border:1px solid #344d60;border-radius:14px;overflow:hidden}.framebox.mobile{max-width:390px}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#a7c9dc;font-size:11px}input[type=file]{display:none}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #263e50;text-align:left}#status{min-height:24px;color:#9fd7ff}.stats{display:flex;gap:24px;flex-wrap:wrap}.stats b{color:#edbe48}details{margin:12px 0}a{color:#a6d9ff}@media(max-width:600px){main{padding:12px}h1{font-size:20px}.controls>*{max-width:100%}}
</style></head><body><main><h1>HABAO 三運動正式前台驗證</h1><p class="notice">下方載入完整正式頁面及相同資源。僅替換資料回應、時間、會員狀態及導航；會員與點數使用隔離記憶體。固定案例是合成輸入，不代表來源擷取成功。T-10 原模型重算另需完整原始輸入。</p>
<div class="controls"><select id="sport" disabled aria-label="球類"><option value="football">⚽ 足球</option><option value="basketball">🏀 NBA</option><option value="baseball">⚾ MLB</option></select><select id="scenario" disabled aria-label="階段狀態"></select><button id="reset">重設情境</button><button id="mobile">手機寬度</button><button id="matrix" disabled class="primary">執行三運動狀態檢查</button></div>
<div class="controls"><button data-view="fixtures" class="active">賽事中心</button><button data-view="history">我的分析</button><button id="latest">最後一份分析結果</button><label class="upload">匯入正式快照 JSON<input id="import" type="file" accept="application/json,.json,.txt"></label><button id="sample">還原固定案例</button></div>
<div class="stats"><span>資料：<b id="origin"></b></span><span>虛擬剩餘：<b id="credits"></b></span><span>本情境虛擬扣點：<b id="debits"></b></span><span>時間：<b id="clock"></b></span></div><p id="status"></p>
<div id="framebox" class="framebox"><iframe id="frame" title="完整正式前台" sandbox="allow-scripts"></iframe></div>
<section class="panel"><h2>狀態檢查</h2><div id="matrixResult">尚未執行</div></section>
<details class="panel"><summary>正式檔案雜湊與驗證範圍</summary><p>頁面與本次載入的正式來源相同；資料回應與時間由外層注入。供應商連線、正式登入及真實扣點須分別核對，不以虛擬扣點冒充正式驗證。</p><pre id="hashes"></pre></details>
<details class="panel"><summary>目前封存結果與模型原始資料</summary><pre id="raw"></pre></details></main><script src="replay.js?v=1"></script></body></html>
