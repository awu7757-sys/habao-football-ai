<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>HABAO 每月預算計算器</title>
<style>
:root{--bg:#070a0f;--panel:#10161f;--line:rgba(255,255,255,.08);--text:#f7f9fc;--muted:#94a0af;--gold:#f2bd4b;--gold2:#ffe39d;--green:#3cdd82;--red:#ff6868;--max:860px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#0d131b 0%,#080b10 48%,#06080c 100%)}
input,button{font:inherit}
a{color:inherit;text-decoration:none}
.app{max-width:var(--max);margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 15px calc(36px + env(safe-area-inset-bottom))}
.back{display:inline-flex;align-items:center;gap:6px;margin:2px 0 16px;color:#aab4c0;font-size:13px;font-weight:800}
.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(24,33,45,.96),rgba(10,15,22,.98))}
.head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.head h1{margin:0 0 10px;font-size:20px;font-weight:900}
.privacy{margin:0;color:#7fb3ff;font-size:14px;font-weight:700}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:20px 22px}
.col h2{margin:0 0 14px;font-size:17px;font-weight:900}
.field{margin-bottom:14px}
.field label{display:block;margin:0 0 7px 2px;color:#aab4c0;font-size:13px;font-weight:800}
.money{position:relative}
.money span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#8a96a5;font-size:14px;font-weight:800;pointer-events:none}
.money input{width:100%;height:46px;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:0 12px 0 46px;color:#edf1f5;background:#0b1118;outline:none;font-size:15px;font-weight:800}
.money input:focus{border-color:rgba(242,189,75,.45);box-shadow:0 0 0 3px rgba(242,189,75,.08)}
.money input[readonly]{color:var(--gold2);background:#0e151e;border-style:dashed}
.err{min-height:16px;margin:4px 2px 0;color:var(--red);font-size:12px;font-weight:700}
.foot{padding:18px 22px 22px;border-top:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot .label{color:#aab4c0;font-size:14px;font-weight:800}
.foot .value{margin-top:6px;font-size:26px;font-weight:950}
.foot .value.neg{color:#ff8585}
.clear{border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:#d6dde5;background:rgba(255,255,255,.05);font-size:13px;font-weight:800;cursor:pointer}
.note{margin:14px 4px 0;color:#7f8a98;font-size:12px;line-height:1.7}
@media(max-width:640px){.cols{grid-template-columns:1fr;gap:6px}}
.steps{display:flex;gap:6px;margin:0 0 14px;font-size:12px;font-weight:850}.steps a,.steps span{flex:1;text-align:center;padding:8px 4px;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#8793a2;background:rgba(255,255,255,.02)}.steps .on{color:#16120a;border-color:transparent;background:linear-gradient(135deg,#f7da80,#dca631)}
.next{display:block;margin-top:14px;padding:14px;border-radius:14px;text-align:center;color:#16120a;background:linear-gradient(135deg,#f7da80,#dca631);font-size:15px;font-weight:900}
.ref{margin-top:6px;color:#8793a2;font-size:12px;font-weight:700}
</style>
</head>
<body>
<!-- 2026-11-22：每月預算計算器（VIP）。所有計算只在本機進行；本頁沒有任何網路請求，輸入值只存在本裝置的 localStorage（依帳號分開），不會上傳。見 PROJECT_NOTES 與 docs/SPEC-BET-ALLOCATION-20261122.md -->
<main class="app">
  <a class="back" href="ai-tools.html">← 返回 AI 工具箱</a>
  <nav class="steps" aria-label="投注資金工具步驟"><span class="on">① 預算計算</span><a href="bet-plan.html">② 本週分配</a><a href="bet-plan.html#report">③ 結算週報</a></nav>
  <section class="card">
    <div class="head">
      <h1>每月預算計算器</h1>
      <p class="privacy">您的資料是保密的，HB 無法查看。</p>
    </div>
    <div class="cols">
      <div class="col">
        <h2>收入</h2>
        <div class="field"><label for="inWage">扣除後的薪資</label><div class="money"><span>NT$</span><input id="inWage" data-group="in" inputmode="decimal" placeholder="0"></div><div class="err" data-for="inWage"></div></div>
        <div class="field"><label for="inPension">退休金</label><div class="money"><span>NT$</span><input id="inPension" data-group="in" inputmode="decimal" placeholder="0"></div><div class="err" data-for="inPension"></div></div>
        <div class="field"><label for="inBenefit">補助</label><div class="money"><span>NT$</span><input id="inBenefit" data-group="in" inputmode="decimal" placeholder="0"></div><div class="err" data-for="inBenefit"></div></div>
        <div class="field"><label for="inOther">其他收入</label><div class="money"><span>NT$</span><input id="inOther" data-group="in" inputmode="decimal" placeholder="0"></div><div class="err" data-for="inOther"></div></div>
        <div class="field"><label for="inTotal">總收入</label><div class="money"><span>NT$</span><input id="inTotal" readonly tabindex="-1" value="0"></div></div>
      </div>
      <div class="col">
        <h2>支出</h2>
        <div class="field"><label for="exRent">房租／房貸</label><div class="money"><span>NT$</span><input id="exRent" data-group="ex" inputmode="decimal" placeholder="0"></div><div class="err" data-for="exRent"></div></div>
        <div class="field"><label for="exUtil">水電費</label><div class="money"><span>NT$</span><input id="exUtil" data-group="ex" inputmode="decimal" placeholder="0"></div><div class="err" data-for="exUtil"></div></div>
        <div class="field"><label for="exLoan">貸款／信用卡</label><div class="money"><span>NT$</span><input id="exLoan" data-group="ex" inputmode="decimal" placeholder="0"></div><div class="err" data-for="exLoan"></div></div>
        <div class="field"><label for="exOther">其他支出</label><div class="money"><span>NT$</span><input id="exOther" data-group="ex" inputmode="decimal" placeholder="0"></div><div class="err" data-for="exOther"></div></div>
        <div class="field"><label for="exTotal">總支出</label><div class="money"><span>NT$</span><input id="exTotal" readonly tabindex="-1" value="0"></div></div>
      </div>
    </div>
    <div class="foot">
      <div><div class="label">可支配所得</div><div class="value" id="disposable">NT$ 0</div><div class="ref" id="weeklyRef"></div></div>
      <button class="clear" id="clearBtn" type="button">清除資料</button>
    </div>
  </section>
  <a class="next" href="bet-plan.html">下一步：設定本週投注分配 →</a>
  <p class="note">資料只保存在這台裝置的瀏覽器中，換手機或清除瀏覽器資料後不會保留。可支配所得＝總收入－總支出。</p>
</main>
<script>
(function(){
  "use strict";
  var member=null;try{member=JSON.parse(sessionStorage.getItem("habao_member")||"null");}catch(e){}
  var KEY="habao_budget_calc_v1:"+String(member&&member.account||"anon");
  var inputs=[].slice.call(document.querySelectorAll("input[data-group]"));
  var fmt=new Intl.NumberFormat("zh-TW",{maximumFractionDigits:0});
  function parse(v){
    var s=String(v==null?"":v).replace(/[,，\s]/g,"");
    if(s==="")return {ok:true,n:0};
    if(!/^\d+(\.\d+)?$/.test(s))return {ok:false,msg:"請輸入 0 以上的數字"};
    var n=Number(s);
    if(!isFinite(n)||n>1e10)return {ok:false,msg:"數字太大"};
    return {ok:true,n:n};
  }
  function calc(){
    var tin=0,tex=0,data={};
    inputs.forEach(function(el){
      var r=parse(el.value),err=document.querySelector('.err[data-for="'+el.id+'"]');
      if(err)err.textContent=r.ok?"":r.msg;
      if(r.ok){if(el.dataset.group==="in")tin+=r.n;else tex+=r.n;}
      data[el.id]=el.value;
    });
    document.getElementById("inTotal").value=fmt.format(Math.round(tin));
    document.getElementById("exTotal").value=fmt.format(Math.round(tex));
    var d=Math.round(tin-tex),out=document.getElementById("disposable");
    out.textContent=(d<0?"−NT$ ":"NT$ ")+fmt.format(Math.abs(d));
    out.classList.toggle("neg",d<0);
    var wr=document.getElementById("weeklyRef");if(wr)wr.textContent=d>0?"換算：每月可支配所得 ÷ 4 ≈ NT$ "+fmt.format(Math.floor(d/4))+" / 週（僅換算，金額由您決定）":"";
    try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
  }
  try{var saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved)inputs.forEach(function(el){if(saved[el.id]!=null)el.value=saved[el.id];});}catch(e){}
  inputs.forEach(function(el){el.addEventListener("input",calc);});
  document.getElementById("clearBtn").addEventListener("click",function(){
    inputs.forEach(function(el){el.value="";});
    try{localStorage.removeItem(KEY);}catch(e){}
    calc();
  });
  calc();
})();
</script>
</body>
</html>
