<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB 公開戰績｜HABAO</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#123d3b,transparent 45%),#051421;color:white}main{max-width:950px;margin:30px auto;padding:22px}.panel{background:linear-gradient(145deg,#132735,#0a1926);border:1px solid #304c57;border-radius:18px;padding:24px;margin:14px 0}.k{color:#efbf52;font-weight:900;letter-spacing:1px}a{color:#eac65a}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.big{font-size:33px;font-weight:850;margin:11px 0}.muted{color:#9fb4c4;font-size:13px}.item{border-bottom:1px solid #31404e;padding:13px 0;display:flex;justify-content:space-between;gap:10px}.small{font-size:13px}@media(max-width:780px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:450px){.metrics{grid-template-columns:1fr}} </style></head><body><main><a href="performance.html">← 返回公開戰績</a><header class="panel"><div class="k">⚾ HABAO · MLB</div><h1>MLB 公開戰績</h1><p class="muted">僅統計正式 T-10 快照及官方已完賽驗證；不納入模擬或會員重跑。公開戰績包含獨贏、讓分、大小分三項；每項僅依賽前唯一正式快照的原始盤口與官方賽果驗證。</p></header><section class="metrics"><div class="panel"><span class="k">已驗證賽事</span><div id="total" class="big">—</div></div><div class="panel"><span class="k">獨贏命中率</span><div id="ml" class="big">—</div></div><div class="panel"><span class="k">讓分命中率</span><div id="sp" class="big">—</div></div><div class="panel"><span class="k">大小分命中率</span><div id="ou" class="big">—</div></div></section><section class="panel"><div class="k">最新官方驗證紀錄</div><div id="list" class="muted">讀取中…</div></section><script>
(async()=>{const e=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');const status=x=>x==='win'?'✅ 命中':x==='loss'?'❌ 未中':x==='push'?'走盤':'未推薦';try{const res=await fetch('https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/baseball-performance-api',{cache:'no-store'});const j=await res.json();if(!res.ok||!j.success)throw Error(j.error||'資料未開放');document.getElementById('total').textContent=j.summary?.verified_matches??0;const rate=x=>x?.hit_rate===null||x?.hit_rate===undefined?'—':x.hit_rate+'%';document.getElementById('ml').textContent=rate(j.markets?.moneyline);document.getElementById('sp').textContent=rate(j.markets?.handicap);document.getElementById('ou').textContent=rate(j.markets?.over_under);document.getElementById('list').innerHTML=j.matches?.length?j.matches.map(x=>'<div class="item"><span>'+e(x.home)+' VS '+e(x.away)+'<br><span class="muted">'+e(x.kickoff_at?.slice(0,10))+'</span></span><span class="small">比分 '+e(x.final_score)+'<br>獨贏 '+status(x.moneyline_result)+' · 讓分 '+status(x.handicap_result)+' · 大小 '+status(x.over_under_result)+'</span></div>').join(''):'尚無完成驗證的 MLB 正式賽事。';}catch(err){document.getElementById('list').textContent='MLB 公開戰績服務尚未部署或正在驗收。';}})();
</script></main></body></html>
