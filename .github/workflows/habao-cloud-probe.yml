name: HABAO Cloud Public Browser Probe
on:
  push:
    branches: [baccarat-cloud-probe]
    paths: ['baccarat-cloud-probe/**', '.github/workflows/habao-cloud-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  public-chrome-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run public-only browser probe
        run: python baccarat-cloud-probe/cloud_probe.py
      - name: Upload public test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habao-public-cloud-probe
          path: probe-output/
          retention-days: 7
      - name: Publish public diagnostics to test branch
        if: always()
        shell: bash
        run: |
          if [ ! -f probe-output/result.json ]; then
            echo "No result.json was generated"
            exit 0
          fi
          mkdir -p cloud-probe-reports
          cp probe-output/result.json cloud-probe-reports/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-probe-reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public cloud probe diagnostics [skip ci]"
            git push origin HEAD:baccarat-cloud-probe
          fi
