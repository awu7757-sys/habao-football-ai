<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 賽事分析｜哈寶足球 AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:#fff;
  background:
  radial-gradient(
    circle at 12% 5%,
    rgba(245,196,81,.055),
    transparent 25%
  ),
  radial-gradient(
    circle at 90% 35%,
    rgba(20,76,91,.08),
    transparent 30%
  ),
  linear-gradient(
    135deg,
    #050f17 0%,
    #071722 52%,
    #06131d 100%
  );
}

/* ========================================
   HABAO V2 - ANALYSIS HEADER
======================================== */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  height:72px;

  border-bottom:1px solid rgba(245,196,81,.10);

  background:
    linear-gradient(
      180deg,
      rgba(5,15,23,.97),
      rgba(4,14,22,.93)
    );

  backdrop-filter:blur(18px);

  box-shadow:
    0 10px 35px rgba(0,0,0,.18);
}

.header-inner{
  width:min(1120px,calc(100% - 32px));
  height:100%;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  color:inherit;
  text-decoration:none;
}

.logo{
  position:relative;

  width:39px;
  height:39px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  color:#171208;

  font-size:20px;
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #ffe37d,
      #dfa527
    );

  border:1px solid rgba(255,227,125,.50);

  box-shadow:
    0 8px 22px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.40);
}

.brand-copy{
  min-width:0;
}

.brand-title{
  color:#fff;

  font-size:15px;
  font-weight:950;

  line-height:1.15;
}

.brand-sub{
  margin-top:4px;

  color:#b88a2c;

  font-size:7px;
  font-weight:900;

  letter-spacing:1.5px;
}

.back{
  display:flex;
  align-items:center;
  gap:7px;

  padding:9px 12px;

  border-radius:10px;

  color:#e5edf1;
  text-decoration:none;

  font-size:11px;
  font-weight:850;

  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
}

.back-arrow{
  color:#f5c451;

  font-size:15px;
  line-height:1;
}

.back:active{
  transform:scale(.97);
}

@media(max-width:600px){

  .header{
    height:66px;
  }

  .header-inner{
    width:calc(100% - 24px);
  }

  .logo{
    width:36px;
    height:36px;

    border-radius:11px;

    font-size:18px;
  }

  .brand-title{
    font-size:14px;
  }

  .brand-sub{
    font-size:6px;
    letter-spacing:1.2px;
  }

  .back{
    padding:8px 10px;
    font-size:10px;
  }
}

/* ========================================
   HABAO V2 - ANALYSIS HERO
======================================== */

main{
  width:min(1120px,calc(100% - 32px));
  margin:30px auto 80px;
}

.analysis-hero{
  position:relative;
  overflow:hidden;

  margin-bottom:18px;
  padding:24px 25px;

  border-radius:20px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.10),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      rgba(13,29,43,.98),
      rgba(6,18,28,.98)
    );

  border:1px solid rgba(245,196,81,.14);

  box-shadow:
    0 18px 45px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.analysis-hero::after{
  content:"";
  position:absolute;

  width:180px;
  height:180px;

  right:-90px;
  top:-110px;

  border-radius:50%;

  border:1px solid rgba(245,196,81,.12);
}

.analysis-engine{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-bottom:17px;

  padding:6px 9px;

  border-radius:999px;

  color:#f5c451;

  font-size:8px;
  font-weight:950;
  letter-spacing:1.4px;

  background:rgba(245,196,81,.06);
  border:1px solid rgba(245,196,81,.16);
}

.engine-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#f5c451;

  box-shadow:0 0 10px rgba(245,196,81,.65);
}

.eyebrow{
  margin-bottom:7px;

  color:#b88a2c;

  font-size:9px;
  font-weight:950;
  letter-spacing:2px;
}

h1{
  margin-bottom:8px;

  color:#fff;

  font-size:29px;
  font-weight:1000;
  letter-spacing:-.5px;
}

.sub{
  max-width:600px;

  margin:0;

  color:#8093a0;

  font-size:12px;
  line-height:1.7;
}


/* ========================================
   HABAO V2 - MATCH HERO CARD
======================================== */

.match-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;
  gap:18px;

  min-height:230px;

  padding:27px 24px;

  border-radius:22px;

  background:
    radial-gradient(
      circle at 50% 110%,
      rgba(245,196,81,.06),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(12,30,43,.98),
      rgba(7,20,31,.98)
    );

  border:1px solid rgba(255,255,255,.075);

  box-shadow:
    0 22px 55px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.match-card::before{
  content:"";

  position:absolute;

  top:0;
  left:15%;
  right:15%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #f5c451,
      transparent
    );
}

.team{
  position:relative;
  z-index:2;

  min-width:0;

  text-align:center;
}

.team-side{
  margin-bottom:13px;

  color:#9b782d;

  font-size:8px;
  font-weight:950;
  letter-spacing:2px;
}

.team-logo-box{
  width:86px;
  height:86px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 14px;
  padding:12px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 14px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.team img{
  width:100%;
  height:100%;

  object-fit:contain;

  margin:0;
}

.team-name{
  min-height:26px;

  color:#fff;

  font-size:17px;
  font-weight:950;
  line-height:1.4;

  overflow-wrap:anywhere;
}

.match-vs{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:9px;
}

.vs{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#f5c451;

  font-size:10px;
  font-weight:1000;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(245,196,81,.14),
      rgba(6,18,28,.98)
    );

  border:1px solid rgba(245,196,81,.30);

  box-shadow:
    0 8px 20px rgba(0,0,0,.22);
}

.vs-line{
  width:1px;
  height:24px;

  background:
    linear-gradient(
      transparent,
      rgba(245,196,81,.28),
      transparent
    );
}


/* ===== MATCH META ===== */

.meta{
  position:relative;

  margin:14px 0 25px;
  padding:12px 15px;

  text-align:center;

  color:#8397a3;

  font-size:11px;
  font-weight:650;
  line-height:1.8;

  border-radius:12px;

  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.055);
}


/* ===== MOBILE ===== */

@media(max-width:600px){

  main{
    width:calc(100% - 24px);
    margin-top:18px;
  }

  .analysis-hero{
    padding:20px 18px;
    border-radius:18px;
  }

  h1{
    font-size:25px;
  }

  .sub{
    font-size:11px;
  }

  .match-card{
    grid-template-columns:
      minmax(0,1fr)
      48px
      minmax(0,1fr);

    gap:7px;

    min-height:205px;

    padding:22px 9px;

    border-radius:19px;
  }

  .team-logo-box{
    width:67px;
    height:67px;

    padding:9px;

    border-radius:18px;
  }

  .team-name{
    font-size:13px;
  }

  .team-side{
    font-size:7px;
  }

  .vs{
    width:35px;
    height:35px;

    font-size:8px;
  }

  .vs-line{
    height:18px;
  }

  .meta{
    margin-top:11px;
    font-size:10px;
  }
}

/* ========================================
   HABAO V2 - AI PICKS
======================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:22px;
}

.pick-card{
  position:relative;
  overflow:hidden;

  min-width:0;
  min-height:225px;

  padding:19px 18px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.065),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      rgba(12,31,43,.98),
      rgba(7,22,32,.98)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 15px 35px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.pick-card::before{
  content:"";

  position:absolute;
  top:0;
  left:18px;
  right:18px;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(245,196,81,.75),
      transparent
    );
}

.pick-label{
  display:flex;
  align-items:center;
  gap:7px;

  margin-bottom:12px;

  color:#9c7b34;

  font-size:9px;
  font-weight:950;
  letter-spacing:1.3px;
}

.pick-label::before{
  content:"";

  width:6px;
  height:6px;

  flex:0 0 auto;

  border-radius:50%;

  background:#f5c451;

  box-shadow:0 0 9px rgba(245,196,81,.50);
}

.pick-value{
  min-height:32px;

  margin-bottom:12px;

  color:#fff;

  font-size:22px;
  font-weight:1000;
  line-height:1.35;

  overflow-wrap:anywhere;
}

.confidence{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:3px;

  margin-bottom:9px;

  color:#9cafb9;

  font-size:10px;
  font-weight:800;
}

.bar{
  height:5px;

  margin-bottom:13px;

  overflow:hidden;

  border-radius:999px;

  background:rgba(255,255,255,.055);
}

.bar > div{
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #b47a17,
      #f5c451,
      #ffe180
    );

  box-shadow:
    0 0 9px rgba(245,196,81,.25);
}

.reason{
  color:#81939e;

  font-size:11px;
  line-height:1.7;
}


/* ========================================
   HABAO V2 - ACTION BUTTONS
======================================== */

.bet-action{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

  margin:4px 0 26px;
}

.bet-btn,
.expert-btn{
  position:relative;
  overflow:hidden;

  width:100%;
  max-width:none;

  min-height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:14px 18px;

  border-radius:13px;

  text-decoration:none;

  font-size:13px;
  font-weight:950;
  letter-spacing:.4px;

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    filter .18s ease;
}


/* ===== 立即投注 ===== */

.bet-btn{
  color:#171208;

  background:
    linear-gradient(
      135deg,
      #ffe076,
      #e4a92e
    );

  border:1px solid rgba(255,225,118,.42);

  box-shadow:
    0 11px 25px rgba(216,155,36,.18),
    inset 0 1px 0 rgba(255,255,255,.38);
}

.bet-btn::after{
  content:"";

  position:absolute;

  width:80px;
  height:140%;

  top:-20%;
  left:-110px;

  transform:rotate(18deg);

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.22),
      transparent
    );

  transition:left .45s ease;
}

.bet-btn:hover::after{
  left:110%;
}

.bet-btn:hover{
  transform:translateY(-2px);

  filter:brightness(1.04);

  box-shadow:
    0 14px 30px rgba(216,155,36,.24),
    inset 0 1px 0 rgba(255,255,255,.38);
}


/* ===== 專人分析 ===== */

.expert-btn{
  color:#f5c451;

  background:
    linear-gradient(
      145deg,
      rgba(14,32,44,.98),
      rgba(8,23,33,.98)
    );

  border:1px solid rgba(245,196,81,.30);

  box-shadow:
    0 11px 25px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.expert-btn:hover{
  transform:translateY(-2px);

  background:
    linear-gradient(
      145deg,
      rgba(20,41,54,.98),
      rgba(10,27,38,.98)
    );

  box-shadow:
    0 14px 30px rgba(0,0,0,.25);
}

.bet-btn:active,
.expert-btn:active{
  transform:scale(.98);
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr;
    gap:11px;
  }

  .pick-card{
    min-height:auto;

    padding:17px 16px;

    border-radius:16px;
  }

  .pick-value{
    min-height:0;

    font-size:19px;
  }

  .reason{
    font-size:11px;
  }

  .bet-action{
    grid-template-columns:1fr;
    gap:10px;
  }

  .bet-btn,
  .expert-btn{
    min-height:50px;
    width:100%;
  }
}

/* ========================================
   HABAO V2 - ANALYSIS DETAIL SECTIONS
======================================== */

.section{
  position:relative;
  overflow:hidden;

  margin-top:14px;
  padding:20px 19px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.045),
      transparent 34%
    ),
    linear-gradient(
      145deg,
      rgba(11,29,41,.98),
      rgba(7,21,31,.98)
    );

  border:1px solid rgba(255,255,255,.065);

  box-shadow:
    0 14px 35px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.section::before{
  content:"";

  position:absolute;
  left:0;
  top:18px;

  width:2px;
  height:28px;

  border-radius:0 3px 3px 0;

  background:
    linear-gradient(
      #ffe078,
      #c78c20
    );

  box-shadow:
    0 0 10px rgba(245,196,81,.25);
}

.section-title{
  display:flex;
  align-items:center;
  gap:8px;

  margin-bottom:13px;

  color:#fff;

  font-size:14px;
  font-weight:950;
}

.section-title::before{
  content:"H";

  width:22px;
  height:22px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex:0 0 auto;

  border-radius:7px;

  color:#171208;

  font-size:9px;
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #ffe078,
      #d79b26
    );

  box-shadow:
    0 5px 12px rgba(0,0,0,.20);
}

.section p{
  color:#8da0aa;

  font-size:12px;
  line-height:1.9;

  white-space:pre-line;
}


/* ========================================
   HABAO V2 - PREDICTED SCORES
======================================== */

.score-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;

  margin-top:4px;
}

.score{
  position:relative;
  overflow:hidden;

  min-width:0;

  padding:19px 12px;

  text-align:center;

  border-radius:14px;

  background:
    linear-gradient(
      145deg,
      rgba(17,39,52,.96),
      rgba(9,26,37,.96)
    );

  border:1px solid rgba(245,196,81,.10);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);
}

.score::after{
  content:"";

  position:absolute;

  left:25%;
  right:25%;
  bottom:0;

  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(245,196,81,.55),
      transparent
    );
}

.score-num{
  color:#fff;

  font-size:25px;
  font-weight:1000;
  letter-spacing:.5px;
}

.score-confidence{
  margin-top:6px;

  color:#c69a43;

  font-size:9px;
  font-weight:850;
  letter-spacing:.3px;
}


/* ========================================
   HABAO V2 - RISK
======================================== */

.risk{
  display:inline-flex;
  align-items:center;
  gap:7px;

  padding:8px 12px;

  border-radius:999px;

  color:#f5c451;

  font-size:10px;
  font-weight:900;

  background:rgba(245,196,81,.07);

  border:1px solid rgba(245,196,81,.20);
}

.risk::before{
  content:"";

  width:6px;
  height:6px;

  border-radius:50%;

  background:#f5c451;

  box-shadow:
    0 0 9px rgba(245,196,81,.50);
}


/* ========================================
   DETAIL MOBILE
======================================== */

@media(max-width:600px){

  .section{
    padding:18px 16px;
    border-radius:16px;
  }

  .section-title{
    font-size:13px;
  }

  .section p{
    font-size:11px;
    line-height:1.85;
  }

  .score-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
  }

  .score{
    padding:16px 6px;
  }

  .score-num{
    font-size:21px;
  }

  .score-confidence{
    font-size:8px;
  }
}

.empty{
  text-align:center;
  padding:80px 20px;
  color:#8ba0a9;
}

.empty a{
  display:inline-block;
  margin-top:18px;
  color:#2ce9a5;
}

@media(max-width:800px){

  h1{
    font-size:26px;
  }
}

.confidence-fire{
  display:inline-block;
  margin-left:6px;
  transform-origin:center bottom;
  animation:firePulse 1.05s ease-in-out infinite;
  filter:drop-shadow(0 0 5px rgba(255,120,30,.65));
}

@keyframes firePulse{
  0%{
    transform:translateY(1px) scale(.94);
    filter:drop-shadow(0 0 3px rgba(255,120,30,.45));
  }

  50%{
    transform:translateY(-2px) scale(1.10);
    filter:drop-shadow(0 0 9px rgba(255,150,40,.9));
  }

  100%{
    transform:translateY(1px) scale(.94);
    filter:drop-shadow(0 0 3px rgba(255,120,30,.45));
  }
}
  
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="home-v2.html" class="brand">
      <div class="logo">H</div>

      <div class="brand-copy">
        <div class="brand-title">哈寶足球 AI</div>
        <div class="brand-sub">FOOTBALL INTELLIGENCE</div>
      </div>
    </a>

    <a class="back" href="football.html">
      <span class="back-arrow">←</span>
      <span>賽事中心</span>
    </a>

  </div>
</header>

<main id="app"></main>

<script>
const raw = sessionStorage.getItem("matchAnalysis");
const app = document.getElementById("app");

if (!raw) {

  app.innerHTML = `
    <div class="empty">
      <h2>找不到賽事分析資料</h2>
      <p>請先從足球賽事列表選擇一場比賽進行分析。</p>
      <a href="football.html">返回足球賽事分析</a>
    </div>
  `;

} else {

  try {

    const data = JSON.parse(raw);

    const fixture = data.fixture || {};
    const analysis = data.analysis || {};
    const rec = analysis.recommendations || {};

    const moneyline = rec.moneyline || {};
    const overUnder = rec.over_under || {};
    const btts = rec.btts || {};
    const scores = analysis.predicted_scores || [];

    const gameDate = fixture.date
      ? new Date(fixture.date)
      : null;

    const timeText = gameDate
      ? gameDate.toLocaleString("zh-TW", {
          timeZone: "Asia/Taipei",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        })
      : "時間未提供";

    const confidenceBar = value =>
