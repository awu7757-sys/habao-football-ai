<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI 賽事分析｜哈寶足球 AI</title>

<style>   

/* ========================================
   HABAO V2 - MATCH INTELLIGENCE FINAL
======================================== */

.v2-analysis-detail{
  position:relative;
  margin-top:30px;
  padding-bottom:12px;
}


/* ===== 標題 ===== */

.v2-detail-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;

  margin-bottom:16px;
  padding:0 2px;
}

.v2-detail-kicker{
  margin-bottom:6px;

  color:#dca82e;

  font-size:9px;
  font-weight:950;
  letter-spacing:2.1px;
}

.v2-detail-title{
  color:#fff;

  font-size:23px;
  font-weight:1000;
  line-height:1.2;
}

.v2-detail-badge{
  flex:0 0 auto;

  padding:8px 11px;

  border:1px solid rgba(245,196,81,.35);
  border-radius:10px;

  background:rgba(245,196,81,.055);

  color:#f5c451;

  font-size:8px;
  font-weight:950;
  letter-spacing:1.4px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);
}


/* ========================================
   情報卡
======================================== */

.v2-insight-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  gap:15px;

  margin-bottom:12px;
  padding:19px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.06),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      rgba(12,31,43,.99),
      rgba(7,22,32,.99)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 15px 35px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.v2-insight-card::before{
  content:"";

  position:absolute;
  left:0;
  top:18px;

  width:2px;
  height:38px;

  border-radius:0 3px 3px 0;

  background:linear-gradient(
    #ffe078,
    #c78c20
  );

  box-shadow:
    0 0 12px rgba(245,196,81,.28);
}

.v2-insight-icon{
  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  color:#f5c451;

  font-size:11px;
  font-weight:1000;
  letter-spacing:.5px;

  background:
    linear-gradient(
      145deg,
      rgba(245,196,81,.13),
      rgba(245,196,81,.035)
    );

  border:1px solid rgba(245,196,81,.20);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);
}

.v2-insight-content{
  min-width:0;
}

.v2-insight-label{
  margin-bottom:6px;

  color:#dca82e;

  font-size:8px;
  font-weight:950;
  letter-spacing:1.6px;
}

.v2-insight-title{
  color:#fff;

  font-size:16px;
  font-weight:1000;
  line-height:1.35;
}

.v2-insight-card p,
.v2-final-card p{
  margin-top:11px;

  color:#8fa4af;

  font-size:11px;
  line-height:1.9;

  letter-spacing:.1px;

  white-space:pre-line;
  overflow-wrap:anywhere;
}


/* ========================================
   SCORE PROJECTION
======================================== */

.v2-score-section{
  position:relative;
  overflow:hidden;

  margin-bottom:12px;
  padding:19px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(11,29,41,.99),
      rgba(7,21,31,.99)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 15px 35px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.v2-score-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  margin-bottom:15px;
}

.v2-score-tag{
  padding:6px 9px;

  border-radius:999px;

  color:#f5c451;

  font-size:8px;
  font-weight:950;
  letter-spacing:1px;

  background:rgba(245,196,81,.07);

  border:1px solid rgba(245,196,81,.20);
}

.v2-score-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.v2-score-card{
  position:relative;
  overflow:hidden;

  min-width:0;
  padding:15px 10px 13px;

  text-align:center;

  border-radius:14px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(245,196,81,.07),
      transparent 48%
    ),
    rgba(255,255,255,.025);

  border:1px solid rgba(245,196,81,.11);
}

.v2-score-rank{
  margin-bottom:8px;

  color:#79642e;

  font-size:8px;
  font-weight:950;
  letter-spacing:1px;
}

.v2-score-number{
  color:#fff;

  font-size:25px;
  font-weight:1000;
  line-height:1.15;
  letter-spacing:.4px;
}

.v2-score-confidence{
  margin-top:7px;

  color:#c69a43;

  font-size:8px;
  font-weight:850;
}

.v2-score-bar{
  height:4px;

  margin-top:10px;

  overflow:hidden;

  border-radius:999px;

  background:rgba(255,255,255,.055);
}

.v2-score-bar > div{
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #b77b16,
      #f5c451,
      #ffe180
    );

  box-shadow:
    0 0 8px rgba(245,196,81,.25);
}


/* ========================================
   RISK ASSESSMENT
======================================== */

.v2-risk-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  margin-bottom:12px;
  padding:18px 19px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(12,30,42,.99),
      rgba(7,22,32,.99)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 13px 30px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.v2-risk-left{
  min-width:0;
}

.v2-risk-value{
  flex:0 0 auto;

  min-width:66px;

  padding:9px 13px;

  text-align:center;

  border-radius:999px;

  color:#f5c451;

  font-size:11px;
  font-weight:1000;

  background:rgba(245,196,81,.07);

  border:1px solid rgba(245,196,81,.24);

  box-shadow:
    0 0 16px rgba(245,196,81,.05);
}


/* ========================================
   FINAL NOTE
======================================== */

.v2-final-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  gap:15px;

  padding:19px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 0% 100%,
      rgba(245,196,81,.08),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(15,34,45,.99),
      rgba(8,23,33,.99)
    );

  border:1px solid rgba(245,196,81,.16);

  box-shadow:
    0 16px 38px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.v2-final-mark{
  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  color:#171208;

  font-size:15px;
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #ffe078,
      #d99d27
    );

  box-shadow:
    0 8px 18px rgba(0,0,0,.22);
}

.v2-final-content{
  min-width:0;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:600px){

  .v2-analysis-detail{
    margin-top:26px;
  }

  .v2-detail-title{
    font-size:21px;
  }

  .v2-detail-badge{
    padding:7px 9px;
    font-size:7px;
  }

  .v2-insight-card,
  .v2-final-card{
    grid-template-columns:40px minmax(0,1fr);
    gap:12px;

    padding:16px;
    border-radius:16px;
  }

  .v2-insight-icon,
  .v2-final-mark{
    width:38px;
    height:38px;

    border-radius:11px;
  }

  .v2-insight-title{
    font-size:14px;
  }

  .v2-insight-card p,
  .v2-final-card p{
    margin-top:9px;

    font-size:10px;
    line-height:1.85;
  }

  .v2-score-section{
    padding:16px;
    border-radius:16px;
  }

  .v2-score-grid{
    gap:6px;
  }

  .v2-score-card{
    padding:13px 5px 11px;
  }

  .v2-score-number{
    font-size:21px;
  }

  .v2-score-confidence{
    font-size:7px;
  }

  .v2-risk-card{
    padding:16px;
    border-radius:16px;
  }

  .v2-risk-value{
    min-width:58px;

    padding:8px 10px;

    font-size:10px;
  }
}
  
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:#fff;
  background:
  radial-gradient(
    circle at 12% 5%,
    rgba(245,196,81,.055),
    transparent 25%
  ),
  radial-gradient(
    circle at 90% 35%,
    rgba(20,76,91,.08),
    transparent 30%
  ),
  linear-gradient(
    135deg,
    #050f17 0%,
    #071722 52%,
    #06131d 100%
  );
}

/* ========================================
   HABAO V2 - ANALYSIS HEADER
======================================== */

.header{
position:relative;
z-index:1000;

  height:72px;

  border-bottom:1px solid rgba(245,196,81,.10);

  background:
    linear-gradient(
      180deg,
      rgba(5,15,23,.97),
      rgba(4,14,22,.93)
    );

  backdrop-filter:blur(18px);

  box-shadow:
    0 10px 35px rgba(0,0,0,.18);
}

.header-inner{
  width:min(1120px,calc(100% - 32px));
  height:100%;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  color:inherit;
  text-decoration:none;
}

.logo{
  position:relative;

  width:39px;
  height:39px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  color:#171208;

  font-size:20px;
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #ffe37d,
      #dfa527
    );

  border:1px solid rgba(255,227,125,.50);

  box-shadow:
    0 8px 22px rgba(0,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.40);
}

.brand-copy{
  min-width:0;
}

.brand-title{
  color:#fff;

  font-size:15px;
  font-weight:950;

  line-height:1.15;
}

.brand-sub{
  margin-top:4px;

  color:#b88a2c;

  font-size:7px;
  font-weight:900;

  letter-spacing:1.5px;
}

.back{
  display:flex;
  align-items:center;
  gap:7px;

  padding:9px 12px;

  border-radius:10px;

  color:#e5edf1;
  text-decoration:none;

  font-size:11px;
  font-weight:850;

  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.07);
}

.back-arrow{
  color:#f5c451;

  font-size:15px;
  line-height:1;
}

.back:active{
  transform:scale(.97);
}

@media(max-width:600px){

  .header{
    height:66px;
  }

  .header-inner{
    width:calc(100% - 24px);
  }

  .logo{
    width:36px;
    height:36px;

    border-radius:11px;

    font-size:18px;
  }

  .brand-title{
    font-size:14px;
  }

  .brand-sub{
    font-size:6px;
    letter-spacing:1.2px;
  }

  .back{
    padding:8px 10px;
    font-size:10px;
  }
}

/* ========================================
   HABAO V2 - ANALYSIS HERO
======================================== */

main{
  width:min(1120px,calc(100% - 32px));
  margin:30px auto 80px;
}

.analysis-hero{
  position:relative;
  overflow:hidden;

  margin-bottom:18px;
  padding:24px 25px;

  border-radius:20px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.10),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      rgba(13,29,43,.98),
      rgba(6,18,28,.98)
    );

  border:1px solid rgba(245,196,81,.14);

  box-shadow:
    0 18px 45px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.analysis-hero::after{
  content:"";
  position:absolute;

  width:180px;
  height:180px;

  right:-90px;
  top:-110px;

  border-radius:50%;

  border:1px solid rgba(245,196,81,.12);
}

.analysis-engine{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-bottom:17px;

  padding:6px 9px;

  border-radius:999px;

  color:#f5c451;

  font-size:8px;
  font-weight:950;
  letter-spacing:1.4px;

  background:rgba(245,196,81,.06);
  border:1px solid rgba(245,196,81,.16);
}

.engine-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#f5c451;

  box-shadow:0 0 10px rgba(245,196,81,.65);
}

.eyebrow{
  margin-bottom:7px;

  color:#b88a2c;

  font-size:9px;
  font-weight:950;
  letter-spacing:2px;
}

h1{
  margin-bottom:8px;

  color:#fff;

  font-size:29px;
  font-weight:1000;
  letter-spacing:-.5px;
}

.sub{
  max-width:600px;

  margin:0;

  color:#8093a0;

  font-size:12px;
  line-height:1.7;
}


/* ========================================
   HABAO V2 - MATCH HERO CARD
======================================== */

.match-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;
  gap:18px;

  min-height:230px;

  padding:27px 24px;

  border-radius:22px;

  background:
    radial-gradient(
      circle at 50% 110%,
      rgba(245,196,81,.06),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(12,30,43,.98),
      rgba(7,20,31,.98)
    );

  border:1px solid rgba(255,255,255,.075);

  box-shadow:
    0 22px 55px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.match-card::before{
  content:"";

  position:absolute;

  top:0;
  left:15%;
  right:15%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #f5c451,
      transparent
    );
}

.team{
  position:relative;
  z-index:2;

  min-width:0;

  text-align:center;
}

.team-side{
  margin-bottom:13px;

  color:#9b782d;

  font-size:8px;
  font-weight:950;
  letter-spacing:2px;
}

.team-logo-box{
  width:86px;
  height:86px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 14px;
  padding:12px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 14px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.team img{
  width:100%;
  height:100%;

  object-fit:contain;

  margin:0;
}

.team-name{
  min-height:26px;

  color:#fff;

  font-size:17px;
  font-weight:950;
  line-height:1.4;

  overflow-wrap:anywhere;
}

.match-vs{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:9px;
}

.vs{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#f5c451;

  font-size:10px;
  font-weight:1000;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(245,196,81,.14),
      rgba(6,18,28,.98)
    );

  border:1px solid rgba(245,196,81,.30);

  box-shadow:
    0 8px 20px rgba(0,0,0,.22);
}

.vs-line{
  width:1px;
  height:24px;

  background:
    linear-gradient(
      transparent,
      rgba(245,196,81,.28),
      transparent
    );
}


/* ===== MATCH META ===== */

.meta{
  position:relative;

  margin:14px 0 25px;
  padding:12px 15px;

  text-align:center;

  color:#8397a3;

  font-size:11px;
  font-weight:650;
  line-height:1.8;

  border-radius:12px;

  background:rgba(255,255,255,.025);
  border:1px solid rgba(255,255,255,.055);
}


/* ===== MOBILE ===== */

@media(max-width:600px){

  main{
    width:calc(100% - 24px);
    margin-top:18px;
  }

  .analysis-hero{
    padding:20px 18px;
    border-radius:18px;
  }

  h1{
    font-size:25px;
  }

  .sub{
    font-size:11px;
  }

  .match-card{
    grid-template-columns:
      minmax(0,1fr)
      48px
      minmax(0,1fr);

    gap:7px;

    min-height:205px;

    padding:22px 9px;

    border-radius:19px;
  }

  .team-logo-box{
    width:67px;
    height:67px;

    padding:9px;

    border-radius:18px;
  }

  .team-name{
    font-size:13px;
  }

  .team-side{
    font-size:7px;
  }

  .vs{
    width:35px;
    height:35px;

    font-size:8px;
  }

  .vs-line{
    height:18px;
  }

  .meta{
    margin-top:11px;
    font-size:10px;
  }
}

/* ========================================
   HABAO V2 - AI PICKS
======================================== */

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
  margin-bottom:22px;
}

.pick-card{
  position:relative;
  overflow:hidden;

  min-width:0;
  min-height:225px;

  padding:19px 18px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.065),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      rgba(12,31,43,.98),
      rgba(7,22,32,.98)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 15px 35px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.pick-card::before{
  content:"";

  position:absolute;
  top:0;
  left:18px;
  right:18px;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(245,196,81,.75),
      transparent
    );
}

.pick-label{
  display:flex;
  align-items:center;
  gap:7px;

  margin-bottom:12px;

  color:#9c7b34;

  font-size:9px;
  font-weight:950;
  letter-spacing:1.3px;
}

.pick-label::before{
  content:"";

  width:6px;
  height:6px;

  flex:0 0 auto;

  border-radius:50%;

  background:#f5c451;

  box-shadow:0 0 9px rgba(245,196,81,.50);
}

.pick-value{
  min-height:32px;

  margin-bottom:12px;

  color:#fff;

  font-size:22px;
  font-weight:1000;
  line-height:1.35;

  overflow-wrap:anywhere;
}

.confidence{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:3px;

  margin-bottom:9px;

  color:#9cafb9;

  font-size:10px;
  font-weight:800;
}

.bar{
  height:5px;

  margin-bottom:13px;

  overflow:hidden;

  border-radius:999px;

  background:rgba(255,255,255,.055);
}

.bar > div{
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #b47a17,
      #f5c451,
      #ffe180
    );

  box-shadow:
    0 0 9px rgba(245,196,81,.25);
}

.reason{
  color:#81939e;

  font-size:11px;
  line-height:1.7;
}


/* ========================================
   HABAO V2 - ACTION BUTTONS
======================================== */

.bet-action{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

  margin:4px 0 26px;
}

.bet-btn,
.expert-btn{
  position:relative;
  overflow:hidden;

  width:100%;
  max-width:none;

  min-height:52px;

  display:flex;
  align-items:center;
  justify-content:center;

<main id="app"></main>

<script>
const raw = sessionStorage.getItem("matchAnalysis");
const app = document.getElementById("app");

if (!raw) {

  app.innerHTML = `
    <div class="empty">
      <h2>找不到賽事分析資料</h2>
      <p>請先從足球賽事列表選擇一場比賽進行分析。</p>
      <a href="football.html">返回足球賽事分析</a>
    </div>
  `;

} else {

  try {

    const data = JSON.parse(raw);

    const fixture = data.fixture || {};
    const analysis = data.analysis || {};
    const rec = analysis.recommendations || {};

const moneyline = rec.moneyline || {};
const handicap = rec.handicap || {};
const overUnder = rec.over_under || {};
const btts = rec.btts || {};
const doubleChance = rec.double_chance || {};
const scores = analysis.predicted_scores || [];

    const gameDate = fixture.date
      ? new Date(fixture.date)
      : null;

    const timeText = gameDate
      ? gameDate.toLocaleString("zh-TW", {
          timeZone: "Asia/Taipei",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        })
      : "時間未提供";

    const confidenceBar = value =>
      Math.max(0, Math.min(100, Number(value || 0)));
    
    const confidenceFire = (value, pick) => {
  if (!pick || pick === "暫不推薦") return "";

  const confidence = Number(value || 0);

  if (confidence >= 90) return '<span class="confidence-fire">🔥🔥🔥</span>';
  if (confidence >= 80) return '<span class="confidence-fire">🔥🔥</span>';
  if (confidence >= 70) return '<span class="confidence-fire">🔥</span>';

  return "";
};
    
    app.innerHTML = `

<div class="analysis-hero">

  <div class="analysis-engine">
    <span class="engine-dot"></span>
    HABAO ENGINE
  </div>

  <div class="eyebrow">AI MATCH ANALYSIS</div>

  <h1>賽事深度分析</h1>

  <div class="sub">
    整合近期數據、賽事資訊與市場資料，提供多維賽事量化分析
  </div>

</div>

     <div class="match-card">

  <div class="team">
    <div class="team-side">主隊</div>

    <div class="team-logo-box">
      <img src="${fixture.home?.logo || ""}" alt="">
    </div>

    <div class="team-name">
      ${fixture.home?.name || fixture.home?.api_name || "主隊"}
    </div>
  </div>

  <div class="match-vs">
    <div class="vs-line"></div>
    <div class="vs">VS</div>
    <div class="vs-line"></div>
  </div>

  <div class="team">
    <div class="team-side">客隊</div>

    <div class="team-logo-box">
      <img src="${fixture.away?.logo || ""}" alt="">
    </div>

    <div class="team-name">
      ${fixture.away?.name || fixture.away?.api_name || "客隊"}
    </div>
  </div>

</div>

      <div class="meta">
      ${({
  "Premier League": "英超",
  "La Liga": "西甲",
  "Bundesliga": "德甲",
  "Serie A": "義甲",
  "Ligue 1": "法甲",
  "UEFA Champions League": "歐洲冠軍聯賽",
  "UEFA Europa League": "歐洲聯賽",
  "Championship": "英格蘭冠軍聯賽",
  "Eredivisie": "荷蘭甲級聯賽",
  "Primeira Liga": "葡萄牙超級聯賽",
  "Jupiler Pro League": "比利時甲級聯賽",
  "Belgian Pro League": "比利時甲級聯賽",
  "UEFA Conference League": "歐洲協會聯賽",
  "Europa Conference League": "歐洲協會聯賽",
"Super Lig": "土耳其超級聯賽",
"Süper Lig": "土耳其超級聯賽",
"KNVB Beker": "荷蘭盃"
          
})[fixture.league] || fixture.league || ""}<br>
        ${timeText}<br>
        ${fixture.venue?.name || ""}${fixture.venue?.city ? "・" + fixture.venue.city : ""}
      </div>

      <div class="grid">

        <!-- 獨贏 -->
        <div class="pick-card">
          <div class="pick-label">獨贏</div>

          <div class="pick-value">
            ${moneyline.pick || "暫不推薦"}
          </div>

          <div class="confidence">
            AI 信心 ${moneyline.confidence || 0}%
            ${confidenceFire(moneyline.confidence, moneyline.pick)}
          </div>

          <div class="bar">
            <div style="width:${confidenceBar(moneyline.confidence)}%"></div>
          </div>

          <div class="reason">
            ${moneyline.reason || "資料不足"}
          </div>
        </div>


        <!-- 讓分 -->
        <div class="pick-card">
          <div class="pick-label">讓分</div>

          <div class="pick-value">
            ${handicap.pick || "暫不推薦"}
          </div>

          ${
            handicap.line && handicap.pick !== "暫不推薦"
              ? `
                <div class="market-line">
                  盤口 ${handicap.line}
                </div>
              `
              : ""
          }

          <div class="confidence">
            AI 信心 ${handicap.confidence || 0}%
            ${confidenceFire(handicap.confidence, handicap.pick)}
          </div>

          <div class="bar">
            <div style="width:${confidenceBar(handicap.confidence)}%"></div>
          </div>

          <div class="reason">
            ${handicap.reason || "資料不足"}
          </div>
        </div>


        <!-- 大小球 -->
        <div class="pick-card">
          <div class="pick-label">大小球</div>

          <div class="pick-value">
            ${overUnder.pick || "暫不推薦"}
          </div>

          <div class="confidence">
            AI 信心 ${overUnder.confidence || 0}%
            ${confidenceFire(overUnder.confidence, overUnder.pick)}
          </div>

          <div class="bar">
            <div style="width:${confidenceBar(overUnder.confidence)}%"></div>
          </div>

          <div class="reason">
            ${overUnder.reason || "資料不足"}
          </div>
        </div>


        <!-- BTTS -->
        <div class="pick-card">
          <div class="pick-label">BTTS</div>

          <div class="pick-value">
            ${btts.pick || "暫不推薦"}
          </div>

          <div class="confidence">
            AI 信心 ${btts.confidence || 0}%
            ${confidenceFire(btts.confidence, btts.pick)}
          </div>

          <div class="bar">
            <div style="width:${confidenceBar(btts.confidence)}%"></div>
          </div>

          <div class="reason">
            ${btts.reason || "資料不足"}
          </div>
        </div>


        <!-- 雙重機會 -->
        <div class="pick-card">
          <div class="pick-label">雙重機會</div>

          <div class="pick-value">
            ${doubleChance.pick || "暫不推薦"}
          </div>

          <div class="confidence">
            AI 信心 ${doubleChance.confidence || 0}%
            ${confidenceFire(
              doubleChance.confidence,
              doubleChance.pick
            )}
          </div>

          <div class="bar">
            <div style="width:${confidenceBar(doubleChance.confidence)}%"></div>
          </div>

          <div class="reason">
            ${doubleChance.reason || "資料不足"}
          </div>
        </div>

      </div>
      
      <div class="bet-action">
  <a
    href="https://www.hd5957.com/"
    target="_blank"
    rel="noopener noreferrer"
    class="bet-btn"
  >
    立即投注 →
  </a>

<a
  href="https://lin.ee/xmU6Cn8"
  target="_blank"
  rel="noopener noreferrer"
  class="expert-btn"
>
  專人分析 →
</a>
</div>
      <div class="v2-analysis-detail">

        <div class="v2-detail-head">
          <div>
            <div class="v2-detail-kicker">HABAO MATCH INTELLIGENCE</div>
            <div class="v2-detail-title">深度賽事情報</div>
          </div>

          <div class="v2-detail-badge">
            AI REPORT
          </div>
        </div>

        <div class="v2-insight-card">
          <div class="v2-insight-icon">01</div>

          <div class="v2-insight-content">
            <div class="v2-insight-label">MATCH INSIGHT</div>
            <div class="v2-insight-title">AI 分析重點</div>

            <p>
              ${analysis.summary || "目前沒有摘要資料。"}
            </p>
          </div>
        </div>


        <div class="v2-insight-card">
          <div class="v2-insight-icon">02</div>

          <div class="v2-insight-content">
            <div class="v2-insight-label">MARKET INTELLIGENCE</div>
            <div class="v2-insight-title">市場與賠率分析</div>

            <p>
              ${analysis.market_analysis || "資料不足"}
            </p>
          </div>
        </div>


        <div class="v2-score-section">

          <div class="v2-score-head">
            <div>
              <div class="v2-insight-label">SCORE PROJECTION</div>
              <div class="v2-insight-title">AI 預測比分</div>
            </div>

            <div class="v2-score-tag">
              TOP 3
            </div>
          </div>

          <div class="v2-score-grid">

            ${scores.slice(0,3).map((item, index) => `
              <div class="v2-score-card">

                <div class="v2-score-rank">
                  0${index + 1}
                </div>

                <div class="v2-score-number">
                  ${item.score || "-"}
                </div>

                <div class="v2-score-confidence">
                  AI 信心 ${item.confidence || 0}%
                </div>

                <div class="v2-score-bar">
                  <div
                    style="width:${confidenceBar(item.confidence)}%"
                  ></div>
                </div>

              </div>
            `).join("")}

          </div>

        </div>


        <div class="v2-risk-card">

          <div class="v2-risk-left">
            <div class="v2-insight-label">RISK ASSESSMENT</div>
            <div class="v2-insight-title">本場風險</div>
          </div>

          <div class="v2-risk-value">
            ${analysis.risk_level || "未評估"}
          </div>

        </div>


        <div class="v2-final-card">

          <div class="v2-final-mark">H</div>

          <div class="v2-final-content">
            <div class="v2-insight-label">FINAL NOTE</div>
            <div class="v2-insight-title">AI 最終提醒</div>

            <p>
              ${analysis.final_note || "請綜合即時資訊判斷。"}
            </p>
          </div>

        </div>

      </div>
    `;

  } catch (error) {

    console.error(error);

    app.innerHTML = `
      <div class="empty">
        <h2>分析資料讀取失敗</h2>
        <p>請返回賽事列表重新進行分析。</p>
        <a href="football.html">返回足球賽事分析</a>
      </div>
    `;

  }
}
</script>

</body>
</html>
