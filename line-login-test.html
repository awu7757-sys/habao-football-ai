<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABAO Login Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(420px, calc(100% - 40px));
      padding: 36px 24px;
      background: #111;
      border: 1px solid #3a3020;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #d4af37;
    }

    p {
      color: #aaa;
      margin-bottom: 28px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .line-btn {
      background: #06c755;
    }

    .google-btn {
      margin-top: 12px;
      background: #fff;
      color: #222;
      border: 1px solid #ddd;
    }

    .logout-btn {
      display: none;
      margin-top: 16px;
      background: #2b2b2b;
      color: #fff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin-top: 22px;
      color: #d4af37;
      line-height: 1.7;
      word-break: break-word;
    }

    .user-info {
      color: #ddd;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>HABAO</h1>
    <p>登入功能測試</p>

    <button
      id="lineLoginBtn"
      class="login-btn line-btn"
    >
      使用 LINE 登入
    </button>

    <button
      id="googleLoginBtn"
      class="login-btn google-btn"
    >
      使用 Google 登入
    </button>

    <button
  id="memberTestBtn"
  class="login-btn google-btn"
  style="display:none;"
>
  建立 / 讀取 HABAO 會員
</button>
    
    <button
      id="logoutBtn"
      class="login-btn logout-btn"
    >
      登出測試帳號
    </button>

    <div id="status">
      尚未登入
    </div>
  </div>

<script>
  const SUPABASE_URL =
    "https://oqtbsbohcfeghgnykwxy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_q6zWQwsHeH5HKQTDj561vQ_VyvmMwSH";

  const REDIRECT_URL =
    "https://awu7757-sys.github.io/habao-football-ai/line-login-test.html";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  const statusEl =
    document.getElementById("status");

  const lineLoginBtn =
    document.getElementById("lineLoginBtn");

  const googleLoginBtn =
    document.getElementById("googleLoginBtn");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const memberTestBtn =
  document.getElementById("memberTestBtn");

  function setButtonsLoading(isLoading) {
    lineLoginBtn.disabled = isLoading;
    googleLoginBtn.disabled = isLoading;
  }


  function showLoggedOut() {
    lineLoginBtn.style.display = "block";
    googleLoginBtn.style.display = "block";
    logoutBtn.style.display = "none";

    setButtonsLoading(false);

    statusEl.textContent =
      "尚未登入";
  }


  function showLoggedIn(session) {
    const user =
      session.user;

    const provider =
      user.app_metadata?.provider || "unknown";

    const providerName =
      provider === "google"
        ? "Google"
        : provider === "custom:line-oauth"
          ? "LINE"
          : provider;

    const email =
      user.email || "未提供";

    const name =
      user.user_metadata?.full_name ||
      user.user_metadata?.name ||
      user.user_metadata?.display_name ||
      "未提供";

    lineLoginBtn.style.display = "none";
    googleLoginBtn.style.display = "none";
    logoutBtn.style.display = "block";
    memberTestBtn.style.display = "block";

    statusEl.innerHTML =
      providerName + " 登入成功 ✅<br><br>" +

      '<span class="user-info">' +

      "Supabase User ID：<br>" +
      user.id +

      "<br><br>Google Email：<br>" +
      email +

      "<br><br>姓名：<br>" +
      name +

      "<br><br>Provider：<br>" +
      provider +

      "</span>";
  }


  async function initAuth() {
    try {

      statusEl.textContent =
        "正在確認登入狀態...";

      const params =
        new URLSearchParams(
          window.location.search
        );

      const oauthError =
        params.get("error");

      const oauthErrorDescription =
        params.get(
          "error_description"
        );


      if (oauthError) {

        console.error(
          "OAuth callback error:",
          oauthError,
          oauthErrorDescription
        );

        statusEl.textContent =
          "登入失敗：" +
          (
            oauthErrorDescription ||
            oauthError
          );

        setButtonsLoading(false);

        return;
      }


      const {
        data,
        error
      } =
        await db.auth.getSession();


      if (error) {

        console.error(
          "getSession error:",
          error
        );

        statusEl.textContent =
          "讀取登入狀態失敗：" +
          error.message;

        setButtonsLoading(false);

        return;
      }


      if (data.session) {
        showLoggedIn(
          data.session
        );

        return;
      }


      showLoggedOut();


    } catch (error) {

      console.error(
        "Auth init error:",
        error
      );

      statusEl.textContent =
        "登入處理發生錯誤：" +
        error.message;

      setButtonsLoading(false);
    }
  }


  lineLoginBtn.addEventListener(
    "click",
    async () => {

      statusEl.textContent =
        "正在前往 LINE...";

      setButtonsLoading(true);


      const {
        data,
        error
      } =
        await db.auth.signInWithOAuth({

          provider:
            "custom:line-oauth",

          options: {

            redirectTo:
              REDIRECT_URL,

            scopes:
              "openid profile"
          }
        });


      if (error) {

        console.error(
          "LINE OAuth start error:",
          error
        );

        statusEl.textContent =
          "LINE 登入啟動失敗：" +
          error.message;

        setButtonsLoading(false);

        return;
      }


      console.log(
        "LINE OAuth started:",
        data
      );
    }
  );


  googleLoginBtn.addEventListener(
    "click",
    async () => {

      statusEl.textContent =
        "正在前往 Google...";

      setButtonsLoading(true);


      const {
        data,
        error
      } =
        await db.auth.signInWithOAuth({

          provider:
            "google",

          options: {

            redirectTo:
              REDIRECT_URL,

            scopes:
              "openid email profile"
          }
        });


      if (error) {

        console.error(
          "Google OAuth start error:",
          error
        );

        statusEl.textContent =
          "Google 登入啟動失敗：" +
          error.message;

        setButtonsLoading(false);

        return;
      }


      console.log(
        "Google OAuth started:",
        data
      );
    }
  );

  memberTestBtn.addEventListener(
  "click",
  async () => {

    memberTestBtn.disabled = true;
    memberTestBtn.textContent =
      "正在建立 / 讀取會員...";

    try {

      const {
        data: { session }
      } = await db.auth.getSession();

      if (!session) {
        throw new Error(
          "找不到登入 Session"
        );
      }

      const response = await fetch(
        "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/oauth-member-login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              session.access_token
          },

          body:
            JSON.stringify({})
        }
      );

      const data =
        await response.json();

      console.log(
        "OAUTH MEMBER RESULT:",
        data
      );

      if (!response.ok || !data.success) {
        throw new Error(
          data.message ||
          "會員建立失敗"
        );
      }

      sessionStorage.setItem(
        "habao_member",
        JSON.stringify(
          data.member
        )
      );

      statusEl.innerHTML =
        "HABAO 會員驗證成功 ✅<br><br>" +

        "首次建立：" +
        (data.is_new_member ? "是" : "否") +

        "<br><br>本次贈送：" +
        data.signup_bonus +
        " 積分" +

        "<br><br>目前積分：" +
        data.member.analysis_credits +

        "<br><br>會員帳號：<br>" +
        data.member.account;
    }

    catch (error) {

      console.error(
        "MEMBER TEST ERROR:",
        error
      );

      statusEl.textContent =
        "會員測試失敗：" +
        error.message;
    }

    finally {

      memberTestBtn.disabled =
        false;

      memberTestBtn.textContent =
        "建立 / 讀取 HABAO 會員";
    }
  }
);

  logoutBtn.addEventListener(
    "click",
    async () => {

      statusEl.textContent =
        "正在登出...";

      logoutBtn.disabled = true;

      const {
        error
      } =
        await db.auth.signOut();


      logoutBtn.disabled = false;


      if (error) {

        statusEl.textContent =
          "登出失敗：" +
          error.message;

        return;
      }


      showLoggedOut();
    }
  );


  db.auth.onAuthStateChange(
    (event, session) => {

      console.log(
        "AUTH EVENT:",
        event
      );


      if (
        event === "SIGNED_IN" &&
        session
      ) {

        showLoggedIn(
          session
        );

      }


      if (
        event === "SIGNED_OUT"
      ) {

        showLoggedOut();

      }
    }
  );


  initAuth();
</script>

</body>
</html>
