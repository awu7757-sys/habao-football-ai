<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABAO LINE Login Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(420px, calc(100% - 40px));
      padding: 36px 24px;
      background: #111;
      border: 1px solid #3a3020;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #d4af37;
    }

    p {
      color: #aaa;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #06c755;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 22px;
      color: #d4af37;
      line-height: 1.7;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>HABAO</h1>
    <p>LINE Login 測試</p>

    <button id="lineLoginBtn">
      使用 LINE 登入
    </button>

    <div id="status">尚未登入</div>
  </div>

<script>
  const SUPABASE_URL =
    "https://oqtbsbohcfeghgnykwxy.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_q6zWQwsHeH5HKQTDj561vQ_VyvmMwSH";

  const { createClient } = supabase;

  const db = createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false
      }
    }
  );

  const statusEl =
    document.getElementById("status");

  const loginBtn =
    document.getElementById("lineLoginBtn");


  function showLoggedIn(session) {
    loginBtn.style.display = "none";

    statusEl.innerHTML =
      "LINE 登入成功 ✅<br><br>" +
      "Supabase User ID：<br>" +
      session.user.id;
  }


  async function initAuth() {
    try {

      statusEl.textContent =
        "正在確認登入狀態...";

      const params =
        new URLSearchParams(window.location.search);

      const code =
        params.get("code");

      const oauthError =
        params.get("error");

      const oauthErrorDescription =
        params.get("error_description");


      // OAuth 本身有回傳錯誤
      if (oauthError) {

        console.error(
          "OAuth callback error:",
          oauthError,
          oauthErrorDescription
        );

        statusEl.textContent =
          "LINE 登入失敗：" +
          (oauthErrorDescription || oauthError);

        loginBtn.style.display = "block";

        return;
      }


      // Supabase PKCE callback
      if (code) {

        statusEl.textContent =
          "正在建立登入 Session...";

        console.log(
          "OAuth callback code detected"
        );

        const {
          data,
          error
        } =
          await db.auth.exchangeCodeForSession(code);

        if (error) {

          console.error(
            "exchangeCodeForSession error:",
            error
          );

          statusEl.textContent =
            "Session 建立失敗：" +
            error.message;

          loginBtn.style.display =
            "block";

          return;
        }


        console.log(
          "Session exchange success:",
          !!data.session
        );


        // 成功交換後才清除網址 code
        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        if (data.session) {
          showLoggedIn(data.session);
          return;
        }
      }


      // 沒有 callback code 時，
      // 檢查瀏覽器是否已有 Session
      const {
        data,
        error
      } =
        await db.auth.getSession();

      if (error) {

        console.error(
          "getSession error:",
          error
        );

        statusEl.textContent =
          "讀取登入狀態失敗：" +
          error.message;

        loginBtn.style.display =
          "block";

        return;
      }


      if (data.session) {
        showLoggedIn(data.session);
        return;
      }


      statusEl.textContent =
        "尚未登入";

      loginBtn.style.display =
        "block";


    } catch (error) {

      console.error(
        "Auth init error:",
        error
      );

      statusEl.textContent =
        "登入處理發生錯誤：" +
        error.message;

      loginBtn.style.display =
        "block";
    }
  }


  loginBtn.addEventListener(
    "click",
    async () => {

      statusEl.textContent =
        "正在前往 LINE...";

      loginBtn.disabled = true;


      const {
        data,
        error
      } =
        await db.auth.signInWithOAuth({

          provider:
            "custom:line-oauth",

          options: {

            redirectTo:
              "https://awu7757-sys.github.io/habao-football-ai/line-login-test.html",

            scopes:
              "openid profile"
          }
        });


      if (error) {

        console.error(
          "LINE OAuth start error:",
          error
        );

        statusEl.textContent =
          "登入啟動失敗：" +
          error.message;

        loginBtn.disabled =
          false;

        return;
      }


      console.log(
        "OAuth started:",
        data
      );
    }
  );


  db.auth.onAuthStateChange(
    (event, session) => {

      console.log(
        "AUTH EVENT:",
        event
      );

      if (
        event === "SIGNED_IN" &&
        session
      ) {
        showLoggedIn(session);
      }
    }
  );


  initAuth();
</script>

</body>
</html>
