<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HABAO LINE Login Test</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .box {
      width: min(420px, calc(100% - 40px));
      padding: 36px 24px;
      background: #111;
      border: 1px solid #3a3020;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #d4af37;
    }

    p {
      color: #aaa;
      margin-bottom: 28px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #06c755;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    #status {
      margin-top: 22px;
      color: #d4af37;
      line-height: 1.7;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>HABAO</h1>
    <p>LINE Login 測試</p>

    <button id="lineLoginBtn">
      使用 LINE 登入
    </button>

    <div id="status">尚未登入</div>
  </div>

  <script>
    const SUPABASE_URL =
      "https://oqtbsbohcfeghgnykwxy.supabase.co";

    // ↓↓↓ 這裡等等填你的 Supabase Publishable / anon key
    const SUPABASE_KEY =
      "sb_publishable_q6zWQwsHeH5HKQTDj561vQ_VyvmMwSH";

    const { createClient } = supabase;

    const db = createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const statusEl = document.getElementById("status");

    async function checkLogin() {
      const {
        data: { session }
      } = await db.auth.getSession();

      if (!session) {
        statusEl.textContent = "尚未登入";
        return;
      }

      const user = session.user;

      statusEl.innerHTML =
        "LINE 登入成功 ✅<br>" +
        "Supabase User ID：<br>" +
        user.id;
    }

    document
      .getElementById("lineLoginBtn")
      .addEventListener("click", async () => {

        statusEl.textContent = "正在前往 LINE...";

        const { error } =
          await db.auth.signInWithOAuth({
            provider: "custom:line",

            options: {
              redirectTo:
                "https://awu7757-sys.github.io/habao-football-ai/line-login-test.html",

              scopes: "openid profile"
            }
          });

        if (error) {
          console.error(error);
          statusEl.textContent =
            "登入啟動失敗：" + error.message;
        }
      });

    checkLogin();
  </script>

</body>
</html>
