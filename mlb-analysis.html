/* ========================================
   HABAO V2 - MATCH INTELLIGENCE FINAL
======================================== */

.v2-analysis-detail{
  position:relative;
  margin-top:30px;
  padding-bottom:12px;
}


/* ===== 標題 ===== */

.v2-detail-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;

  margin-bottom:16px;
  padding:0 2px;
}

.v2-detail-kicker{
  margin-bottom:6px;

  color:#dca82e;

  font-size:9px;
  font-weight:950;
  letter-spacing:2.1px;
}

.v2-detail-title{
  color:#fff;

  font-size:23px;
  font-weight:1000;
  line-height:1.2;
}

.v2-detail-badge{
  flex:0 0 auto;

  padding:8px 11px;

  border:1px solid rgba(245,196,81,.35);

  font-size:8px;
  font-weight:950;
  letter-spacing:1.4px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.025);
}


/* ========================================
   情報卡
======================================== */

.v2-insight-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  gap:15px;

  margin-bottom:12px;
  padding:19px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.06),
      transparent 38%
    ),
    linear-gradient(
      145deg,
      rgba(12,31,43,.99),
      rgba(7,22,32,.99)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 15px 35px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.v2-insight-card::before{
  content:"";

  position:absolute;
  left:0;
  top:18px;

  width:2px;
  height:38px;

  border-radius:0 3px 3px 0;

  background:linear-gradient(
    #ffe078,
    #c78c20
  );

  box-shadow:
    0 0 12px rgba(245,196,81,.28);
}

.v2-insight-icon{
  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  color:#f5c451;

  font-size:11px;
  font-weight:1000;
  letter-spacing:.5px;

  background:
    linear-gradient(
      145deg,
      rgba(245,196,81,.13),
      rgba(245,196,81,.035)
    );

  border:1px solid rgba(245,196,81,.20);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.035);
}

.v2-insight-content{
  min-width:0;
}

.v2-insight-label{
  margin-bottom:6px;

  color:#dca82e;

  font-size:8px;
  font-weight:950;
  letter-spacing:1.6px;
}

.v2-insight-title{
  color:#fff;

  font-size:16px;
  font-weight:1000;
  line-height:1.35;
}

.v2-insight-card p,
.v2-final-card p{
  margin-top:11px;

  color:#8fa4af;

  font-size:11px;
  line-height:1.9;

  letter-spacing:.1px;

  white-space:pre-line;
  overflow-wrap:anywhere;
}


/* ========================================
   SCORE PROJECTION
======================================== */

.v2-score-section{
  position:relative;
  overflow:hidden;

  margin-bottom:12px;
  padding:19px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(11,29,41,.99),
      rgba(7,21,31,.99)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 15px 35px rgba(0,0,0,.20),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.v2-score-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;

  margin-bottom:15px;
}

.v2-score-tag{
  padding:6px 9px;

  border-radius:999px;

  color:#f5c451;

  font-size:8px;
  font-weight:950;
  letter-spacing:1px;

  background:rgba(245,196,81,.07);

  border:1px solid rgba(245,196,81,.20);
}

.v2-score-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}

.v2-score-card{
  position:relative;
  overflow:hidden;

  min-width:0;
  padding:15px 10px 13px;

  text-align:center;

  border-radius:14px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(245,196,81,.07),
      transparent 48%
    ),
    rgba(255,255,255,.025);

  border:1px solid rgba(245,196,81,.11);
}

.v2-score-rank{
  margin-bottom:8px;

  color:#79642e;

  font-size:8px;
  font-weight:950;
  letter-spacing:1px;
}

.v2-score-number{
  color:#fff;

  font-size:25px;
  font-weight:1000;
  line-height:1.15;
  letter-spacing:.4px;
}

.v2-score-confidence{
  margin-top:7px;

  color:#c69a43;

  font-size:8px;
  font-weight:850;
}

.v2-score-bar{
  height:4px;

  margin-top:10px;

  overflow:hidden;

  border-radius:999px;

  background:rgba(255,255,255,.055);
}

.v2-score-bar > div{
  height:100%;

  border-radius:inherit;

  background:
    linear-gradient(
      90deg,
      #b77b16,
      #f5c451,
      #ffe180
    );

  box-shadow:
    0 0 8px rgba(245,196,81,.25);
}


/* ========================================
   RISK ASSESSMENT
======================================== */

.v2-risk-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;

  margin-bottom:12px;
  padding:18px 19px;

  border-radius:18px;

  background:
    linear-gradient(
      145deg,
      rgba(12,30,42,.99),
      rgba(7,22,32,.99)
    );

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 13px 30px rgba(0,0,0,.18),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.v2-risk-left{
  min-width:0;
}

.v2-risk-value{
  flex:0 0 auto;

  min-width:66px;

  padding:9px 13px;

  text-align:center;

  border-radius:999px;

  color:#f5c451;

  font-size:11px;
  font-weight:1000;

  background:rgba(245,196,81,.07);

  border:1px solid rgba(245,196,81,.24);

  box-shadow:
    0 0 16px rgba(245,196,81,.05);
}


/* ========================================
   FINAL NOTE
======================================== */

.v2-final-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:48px minmax(0,1fr);
  gap:15px;

  padding:19px;

  border-radius:18px;

  background:
    radial-gradient(
      circle at 0% 100%,
      rgba(245,196,81,.08),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(15,34,45,.99),
      rgba(8,23,33,.99)
    );

  border:1px solid rgba(245,196,81,.16);

  box-shadow:
    0 16px 38px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.035);
}

.v2-final-mark{
  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  color:#171208;

  font-size:15px;
  font-weight:1000;

  background:
    linear-gradient(
      145deg,
      #ffe078,
      #d99d27
    );

  box-shadow:
    0 8px 18px rgba(0,0,0,.22);
}

.v2-final-content{
  min-width:0;
}


/* ========================================
   MOBILE
======================================== */

@media(max-width:600px){

  .v2-analysis-detail{
    margin-top:26px;
  }

  .v2-insight-title{

  }

  .v2-insight-card p,

  }

  .v2-score-section{

  }

  .v2-score-grid{

  }

  .v2-score-card{

  }

  .v2-score-number{
    font-size:21px;
  }

  .v2-score-confidence{
    font-size:7px;
  }

  .v2-risk-card{
    padding:16px;
    border-radius:16px;
  }

  .v2-risk-value{
    min-width:58px;

    padding:8px 10px;

    font-size:10px;
  }
}

/* ========================================
   HABAO V2 - ANALYSIS HEADER
======================================== */

.header{
position:relative;
z-index:1000;

  height:72px;

  border-bottom:1px solid rgba(245,196,81,.10);

  background:
    linear-gradient(
      180deg,
      rgba(5,15,23,.97),
      rgba(4,14,22,.93)
    );

  backdrop-filter:blur(18px);

  box-shadow:
    0 10px 35px rgba(0,0,0,.18);
}

.header-inner{
  width:min(1120px,calc(100% - 32px));
  height:100%;

  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;

  color:inherit;
  text-decoration:none;
}

.logo{
  position:relative;

  width:39px;
  height:39px;
  flex:0 0 39px;

  background:
    url("./habao-hb-logo.png")

  filter:
    drop-shadow(0 8px 16px rgba(0,0,0,.38))

}

.brand-copy{

}

.brand-title{
  color:#fff;

}

}

.back{
  display:flex;
  align-items:center;
  gap:7px;

  padding:9px 12px;

  border-radius:10px;

  color:#e5edf1;

  font-size:11px;

  }

  }

  }
}

/* ========================================
   HABAO V2 - ANALYSIS HERO
======================================== */

main{
  width:min(1120px,calc(100% - 32px));
  margin:30px auto 80px;
}

.analysis-hero{
  position:relative;
  overflow:hidden;

  margin-bottom:18px;
  padding:24px 25px;

  border-radius:20px;

  background:
    radial-gradient(
      circle at 100% 0%,
      rgba(245,196,81,.10),
      transparent 35%
    ),
    linear-gradient(
      145deg,
      rgba(13,29,43,.98),
      rgba(6,18,28,.98)
    );

  border:1px solid rgba(245,196,81,.14);

  box-shadow:
    0 18px 45px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.analysis-hero::after{
  content:"";
  position:absolute;

  width:180px;
  height:180px;

  right:-90px;
  top:-110px;

  border-radius:50%;

  border:1px solid rgba(245,196,81,.12);
}

.analysis-engine{
  display:inline-flex;
  align-items:center;
  gap:7px;

  margin-bottom:17px;

  padding:6px 9px;

  border-radius:999px;

  color:#f5c451;

  font-size:8px;
  font-weight:950;
  letter-spacing:1.4px;

  background:rgba(245,196,81,.06);
  border:1px solid rgba(245,196,81,.16);
}

.engine-dot{
  width:6px;
  height:6px;

  border-radius:50%;

  background:#f5c451;

  box-shadow:0 0 10px rgba(245,196,81,.65);
}

.eyebrow{
  margin-bottom:7px;

  color:#b88a2c;

  font-size:9px;
  font-weight:950;
  letter-spacing:2px;
}

h1{
  margin-bottom:8px;

  color:#fff;

  font-size:29px;

}

.sub{

  margin:0;

  color:#8093a0;

  font-size:12px;
  line-height:1.7;
}


/* ========================================
   HABAO V2 - MATCH HERO CARD
======================================== */

.match-card{
  position:relative;
  overflow:hidden;

  display:grid;
  grid-template-columns:
    minmax(0,1fr)
    70px
    minmax(0,1fr);

  align-items:center;
  gap:18px;

  min-height:230px;

  padding:27px 24px;

  border-radius:22px;

  background:
    radial-gradient(
      circle at 50% 110%,
      rgba(245,196,81,.06),
      transparent 42%
    ),
    linear-gradient(
      145deg,
      rgba(12,30,43,.98),
      rgba(7,20,31,.98)
    );

  border:1px solid rgba(255,255,255,.075);

  box-shadow:
    0 22px 55px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.match-card::before{
  content:"";

  position:absolute;

  top:0;
  left:15%;
  right:15%;

  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #f5c451,
      transparent
    );
}

.team{
  position:relative;
  z-index:2;

  min-width:0;

  text-align:center;
}

.team-side{
  margin-bottom:13px;

  color:#9b782d;

  font-size:8px;
  font-weight:950;
  letter-spacing:2px;
}

.team-logo-box{
  width:86px;
  height:86px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 14px;
  padding:12px;

  border-radius:22px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.09),
      rgba(255,255,255,.025)
    );

  border:1px solid rgba(255,255,255,.09);

  box-shadow:
    0 14px 30px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.05);
}

.team img{
  width:100%;
  height:100%;

  object-fit:contain;

  margin:0;
}

.team-name{
  min-height:26px;

  color:#fff;

  font-size:17px;
  font-weight:950;
  line-height:1.4;

  overflow-wrap:anywhere;
}

.match-vs{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:9px;
}

.vs{
  width:42px;
  height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  color:#f5c451;

  font-size:10px;
  font-weight:1000;

  background:
    radial-gradient(
      circle at 50% 30%,
      rgba(245,196,81,.14),
      rgba(6,18,28,.98)
    );

  border:1px solid rgba(245,196,81,.30);

  box-shadow:
    0 8px 20px rgba(0,0,0,.22);
}

.vs-line{
  width:1px;
  height:24px;

  background:
    linear-gradient(
      transparent,
      rgba(245,196,81,.28),
      transparent
    );
}

const PARTNER_PLATFORMS_URL =
  "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/partner-platforms";

let betPartnerPlatforms = [];

function escapePartnerHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderBetPartnerPlatforms() {
  const list =
    document.querySelector(
      ".bet-platform-list"
    );

  const note =
    document.getElementById(
      "betPlatformNote"
    );

  if (
    !list ||
    !betPartnerPlatforms.length
  ) {
    return;
  }

  list.innerHTML =
    betPartnerPlatforms
      .map(platform => {
        const displayName =
          platform.display_name ||
          platform.name ||
          "合作平台";

        const logo =
          platform.logo_url ||
          "habao-hb-logo.png";

        const available=platform.enabled!==false;
        const waiting=!available&&platform.show_when_disabled===true;
        if(!available&&!waiting)return "";
        const url =
          platform.bet_url ||
          platform.register_url ||
          "#";

        return `
          <div class="bet-platform-card ${available?"is-live":"is-pending"}">
            <img
              src="${escapePartnerHtml(logo)}"
              alt="${escapePartnerHtml(displayName)}"
              class="bet-platform-logo"
            >

            <div class="bet-platform-info">
              <strong>
                ${escapePartnerHtml(displayName)}
              </strong>
              <span>
                ${waiting?"待開放":analysisT("betPlatformPartner","合作平台")}
              </span>
            </div>

            ${available?`<a href="${escapePartnerHtml(url)}" target="_blank" rel="noopener noreferrer" class="bet-platform-go">${analysisT("betPlatformGo","前往投注 ↗")}</a>`:
            '<span class="bet-platform-go" style="opacity:.58;cursor:not-allowed" aria-disabled="true">待開放</span>'}
          </div>
        `;
      })
      .join("");

  if (note) {
    note.textContent =
      betPartnerPlatforms.length <= 1
        ? analysisT(
            "betPlatformNote",
            "目前僅開放 HD 皇鼎，其他合作平台將陸續新增。"
          )
        : `目前共有 ${betPartnerPlatforms.length} 個合作平台可選擇。`;
  }
}

async function loadBetPartnerPlatforms() {
  try {
    const response =
      await fetch(
        PARTNER_PLATFORMS_URL,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      !response.ok ||
      !data?.success ||
      !Array.isArray(
        data?.platforms
      ) ||
      !data.platforms.length
    ) {
      return;
    }

    betPartnerPlatforms =
      data.platforms;

    renderBetPartnerPlatforms();

  } catch (error) {
    console.error(
      "PARTNER PLATFORM LOAD ERROR:",
      error
    );
  }
}

  const nav =

  if (
    !nav ||
    !batchResults.length

    return;
  }

  nav.classList.add("show");

    data?.fixture || {};

  const count =

      "batchNextBtn"

      ?.getLanguage?.() ||

  if (count) {
    if (lang === "en") {
      count.textContent =
        `${analysisT("batchCountPrefix", "Match")} ` +
        `${batchIndex + 1} ` +
        `${analysisT("batchCountMiddle", "of")} ` +
        `${batchResults.length}`;
    } else {
      count.textContent =
        `${analysisT("batchCountPrefix", "第")} ` +

        `${analysisT("batchCountMiddle", "/")} ` +
        `${batchResults.length} ` +
        `${analysisT("batchCountSuffix", "場")}`;
    }
  }

  const home =
    getAnalysisLocalizedName(
      fixture.home,
      analysisT(
        "homeTeam",
        "主隊"
      )
    );

  const away =
    getAnalysisLocalizedName(
      fixture.away,
      analysisT(
        "awayTeam",
        "客隊"
      )
    );

  if (team) {
    team.textContent =
      `${home} vs ${away}`+(isBasketballAnalysisData(data)?" · "+(data.v2_stage==="t2"?"T-2 深度分析":data.v2_stage==="t15"?"T-15 最終分析":"T-10 賽前分析"):"");
  }

  if (prev) {
    prev.textContent =
      analysisT(
        "previousMatch",
        "← 上一場"
      );

    prev.disabled =
      batchIndex === 0;
  }

  if (next) {
    next.textContent =
      analysisT(
        "nextMatch",
        "下一場 →"
      );

    next.disabled =
      batchIndex ===
      batchResults.length - 1;
  }
}


function showBatchResult(index) {
  if (
    index < 0 ||
    index >= batchResults.length
  ) {
    return;
  }

  batchIndex = index;

  sessionStorage.setItem(
    "matchAnalysis",
    JSON.stringify(
      batchResults[batchIndex]
    )
  );

  (window.HabaoPageRuntime?.navigate||((url)=>location.assign(url)))(`analysis.html?v=2&batch=1&item=${batchIndex}`);
}


function showPreviousBatchResult() {
  showBatchResult(
    batchIndex - 1
  );
}


function showNextBatchResult() {
  showBatchResult(
    batchIndex + 1
  );
}

function getAnalysisLocalizedName(
  item,
  fallback = ""
) {
  if (!item) {
    return fallback;
  }

  const lang =
    window.HabaoI18n?.getLanguage?.() ||
    "zh-Hant";

  if (lang === "en") {
    return (
      item?.api_name ||
      item?.name ||
      (typeof item === "string" ? item : "") ||
      fallback
    );
  }

  const traditionalName =
    item?.name_zh ||
    item?.name ||
    item?.api_name ||
    (typeof item === "string" ? item : "") ||
    fallback;

  if (lang === "zh-Hans") {
    return window.HabaoI18n?.toSimplified
      ? window.HabaoI18n.toSimplified(
          traditionalName
        )
      : traditionalName;
  }

  return traditionalName;
}


function getAnalysisLeagueName(
  league,
  fixtureCountry = ""
) {
  const lang =
    window.HabaoI18n?.getLanguage?.() ||
    "zh-Hant";

  const apiName =
    league?.api_name ||
    (typeof league === "string" ? league : "") ||
    league?.name ||
    "";

  const leagueId =
    Number(league?.id || 0);

  const leagueCountry =
    String(
      league?.country ||
      fixtureCountry ||
      ""
    ).toLowerCase();

  const isBrazilSerieA =
    leagueId === 71 ||
    (
      /serie a/i.test(apiName) &&
      (
        leagueCountry.includes("brazil") ||
        leagueCountry.includes("brasil")
      )
    );

  /*
    舊的「我的分析」紀錄有一部分曾把巴甲 Serie A
    存成義大利甲級聯賽。這裡除 league id 外，再用 country
    做 fallback，讓既有歷史紀錄不用重新分析也能顯示正確。
  */
  const traditionalById = {
    2: "歐洲冠軍聯賽",
    3: "歐霸盃",
    39: "英格蘭超級聯賽",
    140: "西班牙甲級聯賽",
    78: "德國甲級聯賽",
    135: "義大利甲級聯賽",
    61: "法國甲級聯賽",
    98: "日本職業足球甲級聯賽",
    292: "韓國職業足球甲級聯賽",
    169: "中國足球超級聯賽",
    88: "荷蘭甲級聯賽",
    71: "巴西甲級聯賽"
  };

  const englishById = {
    2: "UEFA Champions League",
    3: "UEFA Europa League",
    39: "Premier League",
    140: "La Liga",
    78: "Bundesliga",
    135: "Serie A",
    61: "Ligue 1",
    98: "J1 League",
    292: "K League 1",
    169: "Chinese Super League",
    88: "Eredivisie",
    71: "Brazil Serie A"
  };

  const traditionalMap = {
    "UEFA Champions League": "歐洲冠軍聯賽",
    "UEFA Europa League": "歐霸盃",
    "Premier League": "英格蘭超級聯賽",
    "La Liga": "西班牙甲級聯賽",
    "Bundesliga": "德國甲級聯賽",
    "Serie A": "義大利甲級聯賽",
    "Ligue 1": "法國甲級聯賽",
    "J1 League": "日本職業足球甲級聯賽",
    "K League 1": "韓國職業足球甲級聯賽",
    "Chinese Super League": "中國足球超級聯賽",
    "Eredivisie": "荷蘭甲級聯賽",
    "Serie A Brazil": "巴西甲級聯賽",
    "Brazil Serie A": "巴西甲級聯賽",
    "Liga Profesional Argentina": "阿根廷甲級聯賽",
    "KNVB Beker": "荷蘭盃",
    "Copa Chile": "智利盃",
    "Primera A": "哥倫比亞甲級聯賽"
  };

  if (lang === "en") {
    if (isBrazilSerieA) {
      return "Brazil Serie A";
    }

    return (
      englishById[leagueId] ||
      apiName ||
      league?.name ||
      ""
    );
  }

  const traditional =
    isBrazilSerieA
      ? "巴西甲級聯賽"
      : traditionalById[leagueId] ||
        (league?.name && /[\u3400-\u9fff]/.test(league.name)
          ? league.name
          : traditionalMap[apiName] ||
            league?.name ||
            apiName ||
            "");

  if (lang === "zh-Hans") {
    return window.HabaoI18n?.toSimplified
      ? window.HabaoI18n.toSimplified(traditional)

function formatAsianMarketLine(
  value,
  forcePlus = false
) {
  const raw =
    String(
      value ?? ""
    )
      .trim()
      .replace(/−/g, "-")
      .replace(/＋/g, "+");

  if (!raw) {
    return "";
  }

  if (raw.includes("/")) {
    return raw;
  }

  const n =
    Number(raw);

  if (!Number.isFinite(n)) {
    return raw;
  }

  const rounded =
    Math.round(
      Math.abs(n) * 4
    ) / 4;

  const base =
    Math.floor(rounded);

  const fraction =
    Number(
      (
        rounded -
        base
      ).toFixed(2)
    );

  let body = "";

  if (fraction === 0.25) {
    body =
      `${base}/${base + 0.5}`;
  } else if (fraction === 0.75) {
    body =
      `${base + 0.5}/${base + 1}`;
  } else {
    body =
      String(rounded)
        .replace(/\.0$/, "");
  }

  const sign =
    n < 0
      ? "-"
      : (
          n > 0 &&
          (
            forcePlus ||
            raw.startsWith("+")
          )
        )
        ? "+"
        : "";

  return sign + body;
}

function formatAsianPickText(

  return localized.replace(
    /\b(Over|Under)\s*([+-]?\d+(?:\.\d+)?|[+-]?\d+(?:\.5)?\/\d+(?:\.5)?)/gi,
    (

  ).replace(
    /(大|小)\s*([+-]?\d+(?:\.\d+)?|[+-]?\d+(?:\.5)?\/\d+(?:\.5)?)/g,
    (
      _match,
      side,

    ) =>
      `${side}${formatAsianMarketLine(line)}`
  );
}

  if (directionMatch) {
    const direction = directionMatch[1];
    return /^(大|小)$/.test(direction)
      ? `${direction}${lineText}`
      : `${direction} ${lineText}`;
  }

  const directionOnly = text.match(/^(大|小|Over|Under)$/i);
  if (directionOnly) {
    return /^(大|小)$/.test(directionOnly[1])
      ? `${directionOnly[1]}${lineText}`
      : `${directionOnly[1]} ${lineText}`;
  }

  const noPick = ["暫不推薦", "暂不推荐", "No Recommendation"];
  return text && !noPick.includes(text)
    ? `${text} ${lineText}`
    : text || analysisT("noRecommendation", "暫不推薦");

      if(rv2Num(c.home_spread)&&Number.isFinite(fs)){
        const d=Number(c.home_spread)-fs;
        rv2Rows.push({k:"讓分",mL:"盤口",mV:rv2HomeName+" "+rv2Side(Number(c.home_spread)),oL:"模型公平線",oV:rv2HomeName+" "+rv2Side(Math.round(fs*10)/10),
          edge:Math.abs(d)<0.5?"模型與盤口接近":(d>0?"模型比盤口更看好主隊":"模型比盤口更看好客隊"),edgeV:Math.abs(d)<0.5?"":(Math.round(Math.abs(d)*10)/10)+" 分",neutral:Math.abs(d)<0.5});
      }
      if(rv2Num(c.total)&&Number.isFinite(ft)){
        const d=ft-Number(c.total);
        rv2Rows.push({k:"大小分",mL:"盤口",mV:c.total+" 分",oL:"模型公平線",oV:(Math.round(ft*10)/10)+" 分",
          edge:Math.abs(d)<1?"模型與盤口接近":(d>0?"模型偏向大分":"模型偏向小分"),edgeV:Math.abs(d)<1?"":(Math.round(Math.abs(d)*10)/10)+" 分",neutral:Math.abs(d)<1});
      }
    }else if(rv2Sport==="baseball"){
      const t=data?.model?.markets?.totals||{};
      if(rv2Num(t.market_line)&&rv2Num(t.model_total)){
        const d=Number(t.model_total)-Number(t.market_line);
        rv2Rows.push({k:"大小分",mL:"盤口",mV:t.market_line+" 分",oL:"模型公平線",oV:(Math.round(Number(t.model_total)*10)/10)+" 分",
          edge:Math.abs(d)<0.3?"模型與盤口接近":(d>0?"模型偏向大分":"模型偏向小分"),edgeV:Math.abs(d)<0.3?"":(Math.round(Math.abs(d)*10)/10)+" 分",neutral:Math.abs(d)<0.3});
      }
    }

    /* 關鍵傷停（足球／NBA）與先發投手（MLB） */
    const rv2InjSource=analysis?.v2_stage_evidence?.availability?.items||data?.player_evidence?.availability?.items||basketballInjuries?.items||
      ["home","away"].flatMap(side=>(basketballInjuries?.[side]?.players||[]).map(p=>({...p,side})));
    const rv2InjItems=(Array.isArray(rv2InjSource)?rv2InjSource:[]).map(p=>{
      const name=p?.player_name||p?.name||p?.player?.name||p?.person?.fullName||"";
      const status=String(p?.status||p?.type||p?.reason||"");
      const homeIds=[fixture?.home?.id].filter(Boolean).map(String),teamId=String(p?.team?.id??p?.team_id??"");
      const side=p?.side||(teamId&&homeIds.includes(teamId)?"home":teamId?"away":"");
      const doubt=/question|doubt|probable|day.?to.?day|存疑|可能/i.test(status);
      return name?{name,detail:String(p?.reason||p?.type||p?.status||""),side,doubt}:null;
    }).filter(Boolean);
    const rv2InjChips=list=>list.slice(0,6).map(p=>`<span class="rv2-chip${p.doubt?" q":""}">${rv2Esc(p.name)}${p.detail?"・"+rv2Esc(localizeAnalysisText(p.detail)):""}</span>`).join("");
    const rv2HasSides=rv2InjItems.some(p=>p.side);
    const rv2Pitchers=rv2Sport==="baseball"?["home","away"].map(side=>{
      const ev=analysis?.v2_stage_evidence?.lineups?.probable_pitchers?.[side]||data?.player_evidence?.lineups?.probable_pitchers?.[side]||{};
      const st=data?.data?.[side+"_starter"]||{};
      return {name:fixture?.[side]?.probable_pitcher||ev?.name||st?.name||"",era:st?.era??ev?.era??null};
    }):[];
    const rv2ShowPitchers=rv2Pitchers.length===2&&rv2Pitchers.every(p=>p.name);

    /* 市場卡片：AI 首選＝有推薦的市場中機率／信心最高者（只排序，不改推薦） */
    /* 顯示用：「主隊／客隊」換成隊名，BTTS 補說明；不改封存的推薦內容 */
    const rv2TeamPick=t=>String(t).replace(/^(主隊|主勝|主队|Home)(?=\s|$|<)/,rv2Esc(rv2HomeName)).replace(/^(客隊|客勝|客队|Away)(?=\s|$|<)/,rv2Esc(rv2AwayName));
    const rv2BttsText=t=>/^(是|Yes)$/i.test(String(t).trim())?"是 <small>雙方都進球</small>":/^(否|No)$/i.test(String(t).trim())?"否 <small>至少一隊沒進球</small>":t;
    const rv2Markets=[
      {key:"moneyline",label:analysisT("moneyline","獨贏"),code:rv2Sport==="football"?"1X2":"ML",r:moneyline,
        text:rv2TeamPick(localizeAnalysisText(moneyline.pick)||analysisT("noRecommendation","暫不推薦"))},
      {key:"handicap",label:analysisT("handicap","讓分"),code:"HDP",r:handicap,
        text:rv2TeamPick(localizeAnalysisText(handicap.pick)||analysisT("noRecommendation","暫不推薦"))+(!noMarketRecommendation(handicap)&&rv2Num(handicap.line)?` <small>${formatAsianMarketLine(handicap.line,Number(handicap.line)>0)}</small>`:"")},
      {key:"over_under",label:rv2Sport==="football"?analysisT("overUnder","大小球"):"大小分",code:"O/U",r:overUnder,
        text:formatOverUnderPick(overUnder.pick,overUnder.line)},
      ...(rv2Sport==="football"?[{key:"btts",label:"BTTS",code:"BTTS",r:btts,text:rv2BttsText(localizeAnalysisText(btts.pick)||analysisT("noRecommendation","暫不推薦"))}]:[])
    ];
    const rv2Best=rv2Markets.filter(m=>!noMarketRecommendation(m.r)&&rv2Num(m.r.confidence)).sort((a,b)=>Number(b.r.confidence)-Number(a.r.confidence))[0]||null;
    const rv2Card=(m,full)=>{
      const none=noMarketRecommendation(m.r);
      return `<div class="rv2-card${full?" full":""}${none?" none":""}"><div class="rv2-card-in">
        <div class="rv2-mk"><span>${rv2Esc(m.label)} <span class="rv2-code">${m.code}</span></span>${m===rv2Best?`<span class="rv2-best">★ AI 首選</span>`:""}</div>
        <div class="rv2-pick">${m.text}</div>
        <div class="rv2-prob"><span>${none?rv2Esc(noPickReasonLabel(m.r)):confidenceLabel}</span><b>${none||m.r.confidence==null?"—":Number(m.r.confidence)+"%"}</b></div>
        <div class="rv2-bar"><div style="width:${recommendationBar(m.r)}%"></div></div>
        <div class="rv2-hit" data-hit="${m.key}" hidden></div>
      </div></div>`;
    };
    /* 版面：AI 首選整排；其餘兩兩並排，剩單數時最後一張整排 */
    const rv2Rest=[...rv2Markets.filter(m=>m!==rv2Best&&!noMarketRecommendation(m.r)),...rv2Markets.filter(m=>noMarketRecommendation(m.r))];
    const rv2CardsHtml=[
      ...(rv2Best?[rv2Card(rv2Best,true)]:[]),
      ...rv2Rest.map((m,i)=>rv2Card(m,rv2Rest.length%2===1&&i===rv2Rest.length-1))
    ].join("");

    const rv2DetailBlocks=[];
    if(rv2Win){
      const three=rv2Win.draw!==undefined;
      rv2DetailBlocks.push(`<section class="rv2-panel"><div class="rv2-panel-in">
        <h3 class="rv2-h">賽前勝率</h3>
        <div class="rv2-wp${three?" three":""}">
          <div class="h"><b>${rv2Pct(rv2Win.home)}</b><span>主勝・${rv2Esc(rv2HomeName)}</span></div>
          ${three?`<div class="d"><b>${rv2Pct(rv2Win.draw)}</b><span>和局</span></div>`:""}
          <div class="a"><b>${rv2Pct(rv2Win.away)}</b><span>客勝・${rv2Esc(rv2AwayName)}</span></div>
        </div>
        <div class="rv2-wbar"><div class="h" style="flex:${rv2Win.home}"></div>${three?`<div class="d" style="flex:${rv2Win.draw}"></div>`:""}<div class="a" style="flex:${rv2Win.away}"></div></div>
        <p class="rv2-note">由 HABAO 模型依雙方攻守數據${rv2Sport==="football"?"與本階段資料":"、傷停與先發資料"}推估，僅供參考。</p>
      </div></section>`);
    }
    if(rv2Rows.length){
      rv2DetailBlocks.push(`<section class="rv2-panel"><div class="rv2-panel-in">
        <h3 class="rv2-h">模型 vs 盤口</h3>
        <div class="rv2-vm">${rv2Rows.map(r=>`<div class="rv2-vm-row"><span class="k">${r.k}</span><span class="c">${r.mL}<b>${rv2Esc(r.mV)}</b></span><span class="c m">${r.oL}<b>${rv2Esc(r.oV)}</b></span><span class="rv2-edge${r.neutral?" neutral":""}"><span>${r.edge}</span><span>${rv2Esc(r.edgeV)}</span></span></div>`).join("")}</div>
        <p class="rv2-note">盤口為本階段封存的主流盤線；模型公平線為模型認為兩邊機會相等的線，僅供參考。</p>
      </div></section>`);
    }
    if(rv2Ladder.length&&rv2Ladder.every(x=>x.p!==null)){
      const mainLine=Number(overUnder.line);
      rv2DetailBlocks.push(`<section class="rv2-panel"><div class="rv2-panel-in">
        <h3 class="rv2-h">大小球各線機率</h3>
        <div class="rv2-lines">${rv2Ladder.map(x=>`<div class="rv2-ln${Math.abs(x.line-mainLine)<0.01?" main":""}"><span>${x.line} 球 大</span><div class="tr"><div style="width:${Math.round(x.p*100)}%"></div></div><b>${Math.round(x.p*100)}%</b></div>`).join("")}</div>
        <p class="rv2-note">推薦只針對主流盤口線，其他線機率僅供參考。</p>
      </div></section>`);
    }
    if(rv2ShowPitchers){
      const era=v=>rv2Num(v)?Number(v).toFixed(2):"—";
      const better=rv2Num(rv2Pitchers[0].era)&&rv2Num(rv2Pitchers[1].era)?(Number(rv2Pitchers[0].era)<=Number(rv2Pitchers[1].era)?0:1):-1;
      rv2DetailBlocks.push(`<section class="rv2-panel"><div class="rv2-panel-in">
        <h3 class="rv2-h">先發投手對決</h3>
        <div class="rv2-pitch">${rv2Pitchers.map((p,i)=>`${i===1?`<span class="rv2-pv">VS</span>`:""}<div><div class="nm">${rv2Esc(p.name)}</div><div class="tm">${rv2Esc(i===0?rv2HomeName+"（主）":rv2AwayName+"（客）")}</div><div class="era${better===i?" good":""}">${era(p.era)}<small>本季防禦率 ERA</small></div></div>`).join("")}</div>
        <p class="rv2-note">防禦率越低代表投手表現越好；先發若臨時更換，以最新階段分析為準。</p>
      </div></section>`);
    }else if(rv2InjItems.length){
      const home=rv2InjItems.filter(p=>p.side==="home"),away=rv2InjItems.filter(p=>p.side==="away");
      rv2DetailBlocks.push(`<section class="rv2-panel"><div class="rv2-panel-in">
        <h3 class="rv2-h">關鍵傷停</h3>
        ${rv2HasSides?`<div class="rv2-inj"><div><h4>${rv2Esc(rv2HomeName)}（主）</h4>${rv2InjChips(home)||'<span class="rv2-none">無</span>'}</div><div><h4>${rv2Esc(rv2AwayName)}（客）</h4>${rv2InjChips(away)||'<span class="rv2-none">無</span>'}</div></div>`:`<div>${rv2InjChips(rv2InjItems)}</div>`}
        <p class="rv2-note">紅色：缺陣　黃色：出賽存疑。名單依本階段封存資料。</p>
      </div></section>`);
    }
    const rv2DetailNames=[rv2Win&&"勝率",rv2Rows.length&&"盤口",rv2Ladder.length&&"各線機率",rv2ShowPitchers?"先發投手":(rv2InjItems.length&&"傷停")].filter(Boolean).join("・");

    app.innerHTML = `
<div class="rv2">
  <section class="rv2-match"><div class="rv2-match-in rv2-bg-${rv2Sport}">
    <div class="rv2-strip"><span class="rv2-tag">${rv2Esc(rv2League)}</span><span class="rv2-status"><i></i>${rv2Status}</span><span class="rv2-time">${rv2Esc(timeText)}</span></div>
    <div class="rv2-teams">
      <div class="rv2-team"><div class="rv2-logo"><img src="${resultTeamLogo(fixture.home)}" alt="" onerror="this.onerror=null;this.style.display='none'"></div><div class="rv2-tname">${rv2HomeName}</div><div class="rv2-side">${analysisT("homeTeam","主隊")}</div></div>
      <div class="rv2-vs">VS</div>
      <div class="rv2-team"><div class="rv2-logo"><img src="${resultTeamLogo(fixture.away)}" alt="" onerror="this.onerror=null;this.style.display='none'"></div><div class="rv2-tname">${rv2AwayName}</div><div class="rv2-side">${analysisT("awayTeam","客隊")}</div></div>
    </div>
    <div class="rv2-meta"><span class="rv2-stage ${rv2Stage}">${rv2StageLabel}</span>${rv2Captured?`<span>分析更新 ${rv2Esc(rv2Captured)}</span>`:(rv2Stage==="t10"?`<span>開賽前約 10 小時封存</span>`:"")}</div>
  </div></section>

  <h2 class="rv2-sec">AI 推薦</h2>
  <section class="rv2-grid">${rv2CardsHtml}</section>

  ${rv2DetailBlocks.length?`
  <button type="button" class="rv2-more" aria-expanded="false" onclick="const d=this.nextElementSibling,o=d.hidden;d.hidden=!o;this.setAttribute('aria-expanded',String(o));this.querySelector('.t').textContent=o?'收起詳細數據':'查看詳細數據';this.querySelector('i').textContent=o?'▲':'▼';">
    <i>▼</i><span class="t">查看詳細數據</span><small>${rv2DetailNames}</small>
  </button>
  <section class="rv2-details" hidden>${rv2DetailBlocks.join("")}</section>`:""}

  <div class="bet-action rv2-actions">
    <button type="button" class="bet-btn" onclick="openBetPlatformModal()">${analysisT("betNow", "立即投注 →")}</button>
    <a href="football.html" class="expert-btn">${analysisT("expertAnalysis", "繼續分析 →")}</a>
  </div>
  <p class="rv2-foot">預測結果並非 100% 勝率，請理性判斷。</p>
</div>
    `;

    /* 各市場近 30 天命中率：讀公開戰績 API（唯讀），失敗就不顯示 */
    (async()=>{
      try{
        const api={football:"ai-performance",basketball:"basketball-performance-api",baseball:"baseball-performance-api"}[rv2Sport];
        if(!api)return;
        const res=await fetch(`https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/${api}?days=30`,{headers:{Accept:"application/json"},cache:"no-store"});
        const j=res.ok?await res.json():null;
        if(!j?.success||!j.markets)return;
        document.querySelectorAll(".rv2-hit[data-hit]").forEach(el=>{
          const m=j.markets[el.dataset.hit]||{};
          const ok=Number(m.decided)>0&&rv2Num(m.hit_rate);
          // 2026-11-21：公開戰績沒有統計的市場（例如足球讓分）顯示灰字，避免只有那張卡少一行
          if(!ok){el.textContent="此市場尚無命中率統計";el.classList.add("muted");el.hidden=false;return;}
          el.textContent=el.closest(".rv2-card.full")?`此市場近 30 天命中率 ${Number(m.hit_rate).toFixed(1)}%`:`近 30 天命中 ${Number(m.hit_rate).toFixed(1)}%`;
          el.hidden=false;
        });
      }catch(e){console.warn("RV2 HIT RATE UNAVAILABLE",e);}
    })();

  } catch (error) {

    console.error(error);

app.innerHTML = `
  <div class="empty">
    <h2>${analysisT(
      "analysisReadFailed",
      "分析資料讀取失敗"
    )}</h2>

    <p>${analysisT(
      "analysisReadFailedText",
      "請返回賽事列表重新進行分析。"
    )}</p>

    <a href="football.html">
      ${analysisT(
        "backFootball",
        "返回足球賽事分析"
      )}
    </a>
  </div>
`;
  }
}

function applyAnalysisStaticLanguage() {
  document.title =
    analysisT(
      "pageTitle",
      "AI 賽事分析｜哈寶足球 AI"
    );

    const backText =
    document.querySelector(
      ".back span:last-child"
    );
  /* 2026-11-15：從「我的分析」點進來的結果頁，左上角改為「返回我的分析」並回到同一球類分頁；
     從賽事中心分析進來的維持「賽事中心」。 */
  let analysisReturn=null;
  try{analysisReturn=JSON.parse(sessionStorage.getItem("habao_analysis_return")||"null");}catch{}
  const fromHistory=analysisReturn?.view==="history"&&["football","basketball","baseball"].includes(analysisReturn.sport);
  const backLink=document.querySelector("a.back");
  if (backLink) {
    backLink.setAttribute("href", fromHistory ? "football.html?view=history&history_sport="+analysisReturn.sport : "football.html");
  }
  if (backText) {
    backText.textContent = fromHistory
      ? analysisT("backToMyAnalysis", "我的分析")
      : analysisT(
        "matchCenter",
        "賽事中心"
      );
  }

  const prev =
    document.getElementById(
      "batchPrevBtn"
    );

  if (prev) {
    prev.textContent =
      analysisT(
        "previousMatch",
        "← 上一場"
      );
  }

  const next =
    document.getElementById(
      "batchNextBtn"
    );

  if (next) {
    next.textContent =
      analysisT(
        "nextMatch",
        "下一場 →"
      );
  }
}

applyAnalysisStaticLanguage();

// Saved stage identity and recommendation JSON are immutable during language changes.
// The view localizes labels and team names; it never calls a different analysis endpoint.
async function refreshAnalysisLanguage(){applyAnalysisStaticLanguage();return false;}
function ensureAnalysisLanguageOnLoad(){applyAnalysisStaticLanguage();}
ensureAnalysisLanguageOnLoad();
window.addEventListener('habao:languagechange',()=>{window.HabaoPageRuntime.reload();});
</script>
