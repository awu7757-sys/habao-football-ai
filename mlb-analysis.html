<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MLB AI 分析｜HABAO</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,#07332c,transparent 40%),linear-gradient(#071421,#081626);color:#f4f7fc}main{max-width:940px;margin:auto;padding:36px 20px}.panel{border:1px solid #3e4750;border-radius:19px;background:linear-gradient(125deg,#102637,#0d1a25);padding:25px;margin:15px 0}.k{color:#ffd36a;font-size:13px;letter-spacing:1.2px;font-weight:800}.team{display:flex;justify-content:space-between;gap:14px;text-align:center;align-items:center}.team>div{flex:1}.vs{color:#ffd36a;font-weight:900}.name{font-size:23px;font-weight:800;margin-top:14px}.market{border:1px solid #3b4d5e;border-radius:13px;padding:20px;background:#0b2030}.markets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.value{font-size:25px;font-weight:850;color:#ffd16a;margin-top:12px}.muted{color:#98acba;font-size:13px}a{color:#ffd16a}.warn{color:#9cafbc;font-size:13px}@media(max-width:650px){.markets{grid-template-columns:1fr}.name{font-size:17px}}</style></head><body><main><a href="football.html">← 返回賽事中心</a><section class="panel"><div class="k">⚾ MLB · T-10 OFFICIAL SNAPSHOT</div><h1>AI 賽事分析</h1><p class="muted">獨贏、讓分、大小分皆讀取同場唯一正式快照；重新查看不重新產生模型結果。</p></section><section id="result" aria-live="polite" class="panel">正在載入已保存的 MLB 分析…</section><script>
(()=>{const el=document.getElementById('result'),e=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');let x=null;try{x=JSON.parse(sessionStorage.getItem('matchAnalysis')||'null')}catch{}if(x?.sport!=='baseball'||!x?.snapshot?.id){el.textContent='找不到有效的 MLB 正式分析資料。請從賽事中心進入。';return;}const r=x.analysis?.recommendations||{},fixture=x.fixture||{},m=x.model?.projection||{},pick=(o)=>o?.pick==='home'?'主隊':o?.pick==='away'?'客隊':o?.pick==='over'?'大分':o?.pick==='under'?'小分':'暫無方向';const market=(title,v)=>'<div class="market"><div class="k">'+title+'</div><div class="value">'+e(pick(v))+'</div><p class="muted">'+(v?.line===null||v?.line===undefined?'盤口未取得':'快照盤口：'+e(v.line))+'</p></div>';el.innerHTML='<div class="team"><div class="name">'+e(fixture.home?.name||'主隊')+'</div><div class="vs">VS</div><div class="name">'+e(fixture.away?.name||'客隊')+'</div></div><p class="muted">模型預測 '+e(m.home_runs??'-')+' : '+e(m.away_runs??'-')+'　｜　合計 '+e(m.total_runs??'-')+'</p><div class="markets">'+market('獨贏',r.moneyline)+market('讓分',r.handicap)+market('大小分',r.over_under)+'</div><p class="warn">正式快照：'+e(x.snapshot.id)+'　模型：'+e(x.snapshot.model_version||'-')+'。只使用當時已保存的盤口資料。</p>';})();
</script></main></body></html>
