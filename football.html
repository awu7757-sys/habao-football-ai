 /* ===== AI 分析進度條 ===== */

const STATS_URL =
"https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/public-stats";

async function loadOnlineCount() {
  const countEl = document.getElementById("currentUserCount");

  try {
    const response = await fetch(
      STATS_URL + "?t=" + Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (countEl && typeof data.user_count === "number") {
      countEl.textContent = data.user_count;
    }

  } catch (error) {
    console.error("使用人數載入失敗：", error);

    if (countEl) {
      countEl.textContent = "--";
    }
  }
}

async function verifyMember(){

    }

        "index.html";

      return;
    }

      return;
    }

const MATCH_ANALYSIS_URL =
  "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/match-analysis";

async function openMatch(fixtureId, button){

  if (!fixtureId) {
    alert("找不到這場比賽的 fixtureId");
    return;
  }

if (button) {
    button.disabled = true;
    button.dataset.originalText = button.textContent;
    button.classList.add("loading");

    let progress = 8;

    button.textContent = `AI 分析中 ${progress}%`;
    button.style.setProperty("--progress", `${progress}%`);

    button._progressTimer = setInterval(() => {

        if (progress < 90) {
            progress += Math.floor(Math.random() * 7) + 2;

            if (progress > 90) {
                progress = 90;
            }

            button.textContent = `AI 分析中 ${progress}%`;
            button.style.setProperty("--progress", `${progress}%`);
        }

    }, 600);
}
  try {

    const response = await fetch(MATCH_ANALYSIS_URL, {
      method: "POST",

      headers: {
  "Content-Type": "application/json"
},

body: JSON.stringify({
    fixture_id: fixtureId,
    account: JSON.parse(sessionStorage.getItem("habao_member"))?.account || ""
})
    });

    const data = await response.json();

  if (data.error === "daily_limit_reached") {

      "明日將自動恢復分析次數"
    );
    
if (button) {
  clearInterval(button._progressTimer);
  button.disabled = false;
  button.textContent = button.dataset.originalText || "開始分析 →";
  button.classList.remove("loading");
}
    
    return;
  }

 if (data.error === "member_expired") {

function getTeamNameZH(name) {
  return teamNameZH[name] || name;
}

let currentFixtureOffset = 1;

function switchDate(element, offset) {
  document.querySelectorAll(".date").forEach(item => {
    item.classList.remove("active");
  });

  element.classList.add("active");

  currentFixtureOffset = offset;

  const sectionTitle = document.getElementById("fixtureSectionTitle");

if (sectionTitle) {
  sectionTitle.textContent =
    offset === 0
      ? "⚽ 今日焦點賽事"
      : offset === 1
        ? "⚽ 明日焦點賽事"
        : "⚽ 焦點賽事";
}

  loadTomorrowFixtures(offset);
}  
async function loadTomorrowFixtures(offset = 1) {
  const container = document.getElementById("matchesContainer");

  const loadingText =
  offset === 0
    ? "正在取得今日真實賽事..."
    : offset === 1
      ? "正在取得明日真實賽事..."
      : "正在取得賽事資料...";

container.innerHTML = `
  <div class="ai-note">
    ${loadingText}
  </div>
`;

  try {
    const response = await fetch(FIXTURES_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": FIXTURES_PUBLISHABLE_KEY,
        "Authorization": "Bearer " + FIXTURES_PUBLISHABLE_KEY
      },

      body: JSON.stringify({
  offset: offset
  })
});

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "賽事讀取失敗");
    }

    const allowedLeagues = [
  { name: "Premier League", country: "England" },
  { name: "La Liga", country: "Spain" },
  { name: "Bundesliga", country: "Germany" },
  { name: "Serie A", country: "Italy" },
  { name: "Ligue 1", country: "France" }
];

const fixtures = (data.fixtures || []).filter(match =>
  allowedLeagues.some(league =>
    league.name === match.league?.name &&
    league.country === match.league?.country
  )
);

    if (fixtures.length === 0) {
      container.innerHTML = `
        <div class="ai-note">
          明日暫無符合條件的主要賽事。
        </div>
      `;
      return;
    }

    container.innerHTML = fixtures.map(match => {

      const gameTime = new Date(match.time);

      const time = gameTime.toLocaleTimeString(
        "zh-TW",
        {
          timeZone: "Asia/Taipei",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }
      );

const leagueText = getLeagueNameZH(match.league.name || "");

      return `
        <div class="match-card">

          <div class="match-info">
            <div class="time">${time}</div>
            <div class="league">${leagueText}</div>
          </div>

          <div class="teams">

            <div class="team">
              <img
                class="team-logo"
                src="${match.home.logo || ""}"
                alt="${match.home.name}"
              >
              <div class="team-name">
                ${getTeamNameZH(match.home.name)}
              </div>
            </div>

            <div class="vs">VS</div>

            <div class="team">
              <img
                class="team-logo"
                src="${match.away.logo || ""}"
                alt="${match.away.name}"
              >
              <div class="team-name">
                ${getTeamNameZH(match.away.name)}
              </div>
            </div>

          </div>

         <div class="analysis">

  ${
    currentFixtureOffset === 2
      ? `
        <div class="ai-status">
          🔒 AI ANALYSIS LOCKED
        </div>

        <button
          class="analysis-btn"
          disabled
          style="opacity:0.45; cursor:not-allowed;"
        >
          明日開放分析
        </button>
      `
      : `
        <div class="ai-status">
          ● AI READY
        </div>

        <button
          class="analysis-btn"
          onclick="openMatch(${match.fixtureId}, this)"
        >
          開始分析 →
        </button>
      `
  }

</div>

        </div>
      `;
    }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="ai-note">
        ⚠️ 賽事資料讀取失敗，請稍後再試。
      </div>
    `;
  }
}

function resetAnalysisButtons() {
  document.querySelectorAll(".analysis-btn").forEach(button => {
    clearInterval(button._progressTimer);

    // 後天保持鎖定
    if (currentFixtureOffset === 2) {
      button.disabled = true;
      button.textContent = "明日開放分析";
      button.classList.remove("loading");
      button.style.removeProperty("--progress");
      button.style.opacity = "0.45";
      button.style.cursor = "not-allowed";
      delete button.dataset.originalText;
      return;
    }

    // 今天、明天正常恢復
    button.disabled = false;
    button.textContent = "開始分析 →";
    button.classList.remove("loading");
    button.style.removeProperty("--progress");
    button.style.opacity = "";
    button.style.cursor = "";
    delete button.dataset.originalText;
  });
}

window.addEventListener("pageshow", () => {
  resetAnalysisButtons();

  setTimeout(() => {
    resetAnalysisButtons();
  }, 300);
});
  
// 頁面開啟後自動取得賽事
loadTomorrowFixtures();
</script>
