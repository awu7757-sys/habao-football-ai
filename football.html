<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球分析｜哈寶足球 AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 20%,rgba(20,255,170,.10),transparent 30%),
    linear-gradient(135deg,#041116 0%,#071522 50%,#08162a 100%);
}

/* ===== 頂部 ===== */

.header{
  height:76px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(3,13,18,.75);
  backdrop-filter:blur(12px);
}

.header-inner{
  max-width:1180px;
  height:100%;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  background:linear-gradient(135deg,#0b493b,#103025);
  border:1px solid rgba(72,255,176,.25);
}

.brand-title{
  font-size:16px;
  font-weight:800;
}

.brand-sub{
  margin-top:3px;
  font-size:9px;
  letter-spacing:2px;
  color:#3ff5a5;
}

.member{
  text-align:right;
}

.member-account{
  font-size:12px;
  font-weight:700;
}

.member-expire{
  margin-top:4px;
  font-size:10px;
  color:#607083;
}

/* ===== 主內容 ===== */

.container{
  max-width:1050px;
  margin:0 auto;
  padding:60px 24px 80px;
}

.back{
  color:#42efa4;
  font-size:12px;
  text-decoration:none;
}

.tag{
  margin-top:34px;
  color:#3ff5a5;
  letter-spacing:3px;
  font-size:10px;
  font-weight:800;
}

h1{
  margin-top:10px;
  font-size:38px;
  letter-spacing:-1px;
}

.description{
  margin-top:12px;
  color:#718397;
  font-size:13px;
  line-height:1.8;
}

/* ===== 日期區 ===== */

.date-bar{
  margin-top:38px;
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
}

.date{
  min-width:115px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  background:#0c1b29;
  color:#75869a;
  cursor:pointer;
  text-align:center;
}

.date.active{
  border-color:rgba(56,242,161,.45);
  background:rgba(24,102,76,.28);
  color:#fff;
}

.date-day{
  font-size:11px;
}

.date-num{
  margin-top:5px;
  font-size:14px;
  font-weight:800;
}

/* ===== 聯賽 ===== */

.section-title{
  margin-top:42px;
  margin-bottom:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section-title h2{
  font-size:17px;
}

.section-title span{
  color:#5e7185;
  font-size:10px;
}

/* ===== 比賽卡 ===== */

.match-card{
  margin-bottom:13px;
  padding:20px 22px;
  display:grid;
  grid-template-columns:150px 1fr 180px;
  align-items:center;
  gap:20px;

  background:linear-gradient(
    135deg,
    rgba(14,31,43,.96),
    rgba(10,25,39,.96)
  );

  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  transition:.2s;
}

.match-card:hover{
  border-color:rgba(57,244,166,.28);
  transform:translateY(-1px);
}

.match-info{
  color:#708397;
  font-size:11px;
}

.time{
  color:#fff;
  font-size:20px;
  font-weight:800;
  margin-bottom:5px;
}

.league{
  color:#46e9a2;
  font-size:10px;
}

/* ===== 球隊 ===== */

.teams{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
}

.team{
  width:130px;
  text-align:center;
}

.team-logo{
  width:44px;
  height:44px;
  margin:0 auto 8px;
  border-radius:50%;
  background:#132637;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  border:1px solid rgba(255,255,255,.08);
}

.team-name{
  font-size:14px;
  font-weight:750;
}

.vs{
  color:#536578;
  font-size:11px;
  font-weight:800;
}

/* ===== 分析按鈕 ===== */

.analysis{
  text-align:right;
}

.ai-status{
  font-size:10px;
  color:#43eca2;
  margin-bottom:9px;
}

.analysis-btn{
  border:0;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  color:#062118;
  background:linear-gradient(90deg,#27e68d,#62f5b6);
}

.analysis-btn:hover{
  filter:brightness(1.08);
}

/* ===== AI 提示 ===== */

.ai-note{
  margin-top:28px;
  padding:16px 18px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(14,31,45,.75);
  color:#64788d;
  font-size:11px;
  line-height:1.7;
}

/* ===== 手機 ===== */

@media(max-width:760px){

  .container{
    padding:35px 16px 60px;
  }

  h1{
    font-size:30px;
  }

  .match-card{
    grid-template-columns:1fr;
    text-align:center;
  }

  .analysis{
    text-align:center;
  }

  .teams{
    gap:15px;
  }

  .member-expire{
    display:none;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <div class="brand">
      <div class="logo">⚽</div>

      <div>
        <div class="brand-title">哈寶足球 AI</div>
        <div class="brand-sub">HABAO FOOTBALL AI</div>
      </div>
    </div>

    <div class="member">
      <div class="member-account" id="memberAccount">會員</div>
      <div class="member-expire" id="memberExpire"></div>
    </div>

  </div>
</header>

<main class="container">

  <a href="home.html" class="back">← 返回運動中心</a>

  <div class="tag">FOOTBALL AI CENTER</div>

  <h1>足球賽事分析</h1>

  <div class="description">
    AI 數據整理 × 賽事資訊 × 市場數據<br>
    選擇賽事，查看 AI 賽前分析。
  </div>


  <div class="date-bar">

    <div class="date">
      <div class="date-day">今天</div>
      <div class="date-num">TODAY</div>
    </div>

    <div class="date active">
      <div class="date-day">明天</div>
      <div class="date-num">NEXT DAY</div>
    </div>

    <div class="date">
      <div class="date-day">後天</div>
      <div class="date-num">+2 DAY</div>
    </div>

  </div>


  <div class="section-title">
    <h2>⚽ 明日焦點賽事</h2>
    <span>AI MATCH CENTER</span>
  </div>
<div id="matchesContainer"></div>
  <div class="ai-note">
    AI 將整合球隊近期狀態、攻防數據與賽事資訊進行分析。
    下一階段我們會把這裡改成「自動抓取真實足球賽事」。
  </div>

</main>


<script>

/* =========================
   會員登入保護
========================= */

const savedMember = sessionStorage.getItem("habao_member");

if(!savedMember){

  window.location.href = "index.html";

}else{

  try{

    const member = JSON.parse(savedMember);

    document.getElementById("memberAccount").textContent =
      member.account || "會員";

    if(member.expire_at){

      const expire = new Date(member.expire_at);

      document.getElementById("memberExpire").textContent =
        "使用期限：" + expire.toLocaleString("zh-TW");

    }

  }catch(error){

    sessionStorage.clear();
    window.location.href = "index.html";

  }

}


/* =========================
   賽事分析
========================= */

function openMatch(){

  alert(
    "足球 AI 分析功能下一步接上。\n\n" +
    "我們接下來會讓這裡顯示真正的足球賽事。"
  );

}
// ================================
// 自動載入明日真實足球賽事
// ================================

const FIXTURES_URL =
  "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/tomorrow-fixtures";

// 這裡要放「Supabase Publishable Key」
// 不是 API-FOOTBALL Key、也不是 Supabase Secret Key
const FIXTURES_PUBLISHABLE_KEY = "sb_publishable_q6zWQwsHeH5HKQTDj561vQ_VyvmMwSH";

async function loadTomorrowFixtures() {
  const container = document.getElementById("matchesContainer");

  container.innerHTML = `
    <div class="ai-note">
      正在取得明日真實賽事...
    </div>
  `;

  try {
    const response = await fetch(FIXTURES_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": FIXTURES_PUBLISHABLE_KEY,
        "Authorization": "Bearer " + FIXTURES_PUBLISHABLE_KEY
      },

      body: JSON.stringify({})
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "賽事讀取失敗");
    }

    const fixtures = data.fixtures || [];

    if (fixtures.length === 0) {
      container.innerHTML = `
        <div class="ai-note">
          明日暫無符合條件的主要賽事。
        </div>
      `;
      return;
    }

    container.innerHTML = fixtures.map(match => {

      const gameTime = new Date(match.time);

      const time = gameTime.toLocaleTimeString(
        "zh-TW",
        {
          timeZone: "Asia/Taipei",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }
      );

      const leagueText =
        `${match.league.country || ""} · ${match.league.name || ""}`;

      return `
        <div class="match-card">

          <div class="match-info">
            <div class="time">${time}</div>
            <div class="league">${leagueText}</div>
          </div>

          <div class="teams">

            <div class="team">
              <img
                class="team-logo"
                src="${match.home.logo || ""}"
                alt="${match.home.name}"
              >
              <div class="team-name">
                ${match.home.name}
              </div>
            </div>

            <div class="vs">VS</div>

            <div class="team">
              <img
                class="team-logo"
                src="${match.away.logo || ""}"
                alt="${match.away.name}"
              >
              <div class="team-name">
                ${match.away.name}
              </div>
            </div>

          </div>

          <div class="analysis">
            <div class="ai-status">
              ● AI READY
            </div>

            <button
              class="analysis-btn"
              onclick="openMatch(${match.fixtureId})"
            >
              開始分析 →
            </button>
          </div>

        </div>
      `;
    }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="ai-note">
        ⚠️ 賽事資料讀取失敗，請稍後再試。
      </div>
    `;
  }
}


// 頁面開啟後自動取得賽事
loadTomorrowFixtures();
</script>

</body>
</html>
