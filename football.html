<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
  
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 15% 20%,rgba(20,255,170,.10),transparent 30%),
    linear-gradient(135deg,#041116 0%,#071522 50%,#08162a 100%);
}

/* ===== 頂部 ===== */

.header{
  height:76px;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(3,13,18,.75);
  backdrop-filter:blur(12px);
}

.header-inner{
  max-width:1180px;
  height:100%;
  margin:auto;
  padding:0 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  background:linear-gradient(135deg,#0b493b,#103025);
  border:1px solid rgba(72,255,176,.25);
}

.brand-title{
  font-size:16px;
  font-weight:800;
}

.brand-sub{
  margin-top:3px;
  font-size:9px;
  letter-spacing:2px;
  color:#3ff5a5;
}

.member{
  text-align:right;
}

.member-account{
  font-size:12px;
  font-weight:700;
}
.member-user-count{
  margin-top:4px;
  font-size:10px;
  color:#94a3b8;
  white-space:nowrap;
}

.member-user-count strong{
  margin-left:4px;
  color:#3ff5a5;
  font-size:11px;
  font-weight:800;
}
.member-expire{
  margin-top:4px;
  font-size:10px;
  color:#607083;
}

/* ===== 主內容 ===== */

.container{
  max-width:1050px;
  margin:0 auto;
  padding:60px 24px 80px;
}

.back{
  color:#42efa4;
  font-size:12px;
  text-decoration:none;
}

.tag{
  margin-top:34px;
  color:#3ff5a5;
  letter-spacing:3px;
  font-size:10px;
  font-weight:800;
}

h1{
  margin-top:10px;
  font-size:38px;
  letter-spacing:-1px;
}

.description{
  margin-top:12px;
  color:#718397;
  font-size:13px;
  line-height:1.8;
}

/* ===== 日期區 ===== */

.date-bar{
  margin-top:38px;
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
}

.date{
  min-width:115px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.07);
  background:#0c1b29;
  color:#75869a;
  cursor:pointer;
  text-align:center;
}

.date.active{
  border-color:rgba(56,242,161,.45);
  background:rgba(24,102,76,.28);
  color:#fff;
}

.date-day{
  font-size:11px;
}

.date-num{
  margin-top:5px;
  font-size:14px;
  font-weight:800;
}

/* ===== 聯賽 ===== */

.section-title{
  margin-top:42px;
  margin-bottom:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section-title h2{
  font-size:17px;
}

.section-title span{
  color:#5e7185;
  font-size:10px;
}

/* ===== 比賽卡 ===== */

.match-card{
  margin-bottom:13px;
  padding:20px 22px;
  display:grid;
  grid-template-columns:150px 1fr 180px;
  align-items:center;
  gap:20px;

  background:linear-gradient(
    135deg,
    rgba(14,31,43,.96),
    rgba(10,25,39,.96)
  );

  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  transition:.2s;
}

.match-card:hover{
  border-color:rgba(57,244,166,.28);
  transform:translateY(-1px);
}

.match-info{
  color:#708397;
  font-size:11px;
}

.time{
  color:#fff;
  font-size:20px;
  font-weight:800;
  margin-bottom:5px;
}

.league{
  color:#46e9a2;
  font-size:10px;
}

/* ===== 球隊 ===== */

.teams{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
}

.team{
  width:130px;
  text-align:center;
}

.team-logo{
  width:44px;
  height:44px;
  margin:0 auto 8px;
  border-radius:50%;
  background:#132637;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  border:1px solid rgba(255,255,255,.08);
}

.team-name{
  font-size:14px;
  font-weight:750;
}

.vs{
  color:#536578;
  font-size:11px;
  font-weight:800;
}

/* ===== 分析按鈕 ===== */

.analysis{
  text-align:right;
}

.ai-status{
  font-size:10px;
  color:#43eca2;
  margin-bottom:9px;
}

.analysis-btn{
  border:0;
  padding:11px 17px;
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  color:#062118;
  background:linear-gradient(90deg,#27e68d,#62f5b6);
}

.analysis-btn:hover{
  filter:brightness(1.08);
}

 /* ===== AI 分析進度條 ===== */

.analysis-btn.loading{
    position:relative;
    overflow:hidden;
    min-width:130px;
    cursor:wait;
    background:#0d3b36;
}

.analysis-btn.loading::before{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    height:6px;
    width:var(--progress, 0%);
    background:#ffffff;
    box-shadow:0 0 10px rgba(255,255,255,.8);
    transition:width .35s ease;
}

.analysis-btn.loading::after{
    content:"";
}

@keyframes aiLoadingShine{
    0%{left:-60%;}
    100%{left:120%;}
}

/* ===== AI 提示 ===== */

.ai-note{
  margin-top:28px;
  padding:16px 18px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(14,31,45,.75);
  color:#64788d;
  font-size:11px;
  line-height:1.7;
}

.line-group-card{
  margin-top:28px;
  padding:22px 20px;
  border:1px solid rgba(63,245,165,.25);
  border-radius:18px;
  background:
    linear-gradient(135deg, rgba(63,245,165,.08), rgba(10,24,38,.92));
  box-shadow:0 12px 30px rgba(0,0,0,.18);
}

.line-group-title{
  color:#ffffff;
  font-size:18px;
  font-weight:800;
  line-height:1.4;
}

.line-group-text{
  margin-top:8px;
  color:#94a3b8;
  font-size:13px;
  line-height:1.7;
}

.line-group-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-top:16px;
  padding:12px 18px;
  border-radius:999px;
  background:#3ff5a5;
  color:#06141d;
  font-size:14px;
  font-weight:800;
  text-decoration:none;
  transition:.2s ease;
}

.line-group-btn:active{
  transform:scale(.97);
}

/* ===== 手機 ===== */

@media(max-width:760px){

  .container{
    padding:35px 16px 60px;
  }

  h1{
    font-size:30px;
  }

  .match-card{
    grid-template-columns:1fr;
    text-align:center;
  }

  .analysis{
    text-align:center;
  }

  .teams{
    gap:15px;
  }

  .member-expire{
    display:none;
  }
}
</style>

<body>

<header class="header">

<script>

const STATS_URL =
"https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/public-stats";

async function loadOnlineCount() {
  const countEl = document.getElementById("currentUserCount");

  try {
    const response = await fetch(
      STATS_URL + "?t=" + Date.now(),
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (countEl && typeof data.user_count === "number") {
      countEl.textContent = data.user_count;
    }

  } catch (error) {
    console.error("使用人數載入失敗：", error);

    if (countEl) {
      countEl.textContent = "--";
    }
  }
}

loadOnlineCount();
  
/* =========================
   會員登入保護
========================= */

const savedMember = sessionStorage.getItem("habao_member");

if(!savedMember){

  window.location.href = "index.html";

}else{

  try{

    const member = JSON.parse(savedMember);

    document.getElementById("memberAccount").textContent =
      member.account || "會員";

    if(member.expire_at){

      const expire = new Date(member.expire_at);

      document.getElementById("memberExpire").textContent =
        "使用期限：" + expire.toLocaleString("zh-TW");

    }

  }catch(error){

    sessionStorage.clear();
    window.location.href = "index.html";

  }

}


/* =========================
   賽事分析
========================= */

const MATCH_ANALYSIS_URL =
  "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/match-analysis";

async function openMatch(fixtureId, button){

  if (!fixtureId) {
    alert("找不到這場比賽的 fixtureId");
    return;
  }

if (button) {
    button.disabled = true;
    button.dataset.originalText = button.textContent;
    button.classList.add("loading");

    let progress = 8;

    button.textContent = `AI 分析中 ${progress}%`;
    button.style.setProperty("--progress", `${progress}%`);

    button._progressTimer = setInterval(() => {

        if (progress < 90) {
            progress += Math.floor(Math.random() * 7) + 2;

            if (progress > 90) {
                progress = 90;
            }

            button.textContent = `AI 分析中 ${progress}%`;
            button.style.setProperty("--progress", `${progress}%`);
        }

    }, 600);
}
  try {

    const response = await fetch(MATCH_ANALYSIS_URL, {
      method: "POST",

      headers: {
  "Content-Type": "application/json"
},

body: JSON.stringify({
    fixture_id: fixtureId,
    account: JSON.parse(sessionStorage.getItem("habao_member"))?.account || ""
})
    });

    const data = await response.json();

   if (!response.ok || !data.success) {

  if (data.error === "daily_limit_reached") {
    alert(
      "🤖 今日 AI 分析額度已用完\n\n" +
      "每日可分析 3 場賽事\n" +
      "明日將自動恢復分析次數"
    );
    
if (button) {
  clearInterval(button._progressTimer);
  button.disabled = false;
  button.textContent = button.dataset.originalText || "開始分析 →";
  button.classList.remove("loading");
}
    
    return;
  }

 if (data.error === "member_expired") {
  alert("使用權限已到期，請聯絡哈寶");

  if (button) {
    clearInterval(button._progressTimer);
    button.disabled = false;
    button.textContent = button.dataset.originalText || "開始分析 →";
    button.classList.remove("loading");
  }

  return;
}
     
if (data.error === "member_inactive") {
  alert("AI 分析權限目前已停用，請聯絡哈寶");

  if (button) {
    clearInterval(button._progressTimer);
    button.disabled = false;
    button.textContent = button.dataset.originalText || "開始分析 →";
    button.classList.remove("loading");
  }

  return;
}

  throw new Error(
    data.message || data.error || "AI 賽事分析失敗"
  );
}

    console.log("AI 分析結果：", data);

  sessionStorage.setItem(
  "matchAnalysis",
  JSON.stringify(data)
);

if (button) {
  clearInterval(button._progressTimer);
  button.textContent = "AI 分析完成 100%";
  button.style.setProperty("--progress", "100%");

  setTimeout(() => {
    window.location.href = "analysis.html";
  }, 350);
} else {
  window.location.href = "analysis.html";
}
  } catch (error) {

    console.error(error);

    alert(
      "AI 分析失敗：\n" +
      error.message
    );

    if (button) {
  clearInterval(button._progressTimer);
  button.disabled = false;
  button.textContent = button.dataset.originalText || "開始分析 →";
  button.classList.remove("loading");
}
  }
}
// ================================
// 自動載入明日真實足球賽事
// ================================

const FIXTURES_URL =
  "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/tomorrow-fixtures";

// 這裡要放「Supabase Publishable Key」
// 不是 API-FOOTBALL Key、也不是 Supabase Secret Key
const FIXTURES_PUBLISHABLE_KEY = "sb_publishable_q6zWQwsHeH5HKQTDj561vQ_VyvmMwSH";
// ==============================
// 中文名稱對照
// ==============================

const leagueNameZH = {
  "Premier League": "英格蘭超級聯賽",
  "La Liga": "西班牙甲級聯賽",
  "Bundesliga": "德國甲級聯賽",
  "Serie A": "義大利甲級聯賽",
  "Ligue 1": "法國甲級聯賽",

  "UEFA Champions League": "歐洲冠軍聯賽",
  "UEFA Europa League": "歐霸盃",
  "UEFA Europa Conference League": "歐洲協會聯賽",

  "Eredivisie": "荷蘭甲級聯賽",

};

function getLeagueNameZH(name) {
  return leagueNameZH[name] || name;
}
  // ==============================
// 球隊中文名稱對照
// ==============================

const teamNameZH = {
  "Al-Hilal Saudi FC": "希拉爾",
  "Al-Fayha": "費哈",
  "Al-Ettifaq": "伊蒂法克",
  "Al Riyadh": "利雅德體育",

  "Galatasaray": "加拉塔薩雷",
  "Sparta Rotterdam": "鹿特丹斯巴達",
  "Telstar": "泰爾斯達",

  "Manchester City": "曼城",
  "Manchester United": "曼聯",
  "Liverpool": "利物浦",
  "Arsenal": "阿森納",
  "Chelsea": "切爾西",
  "Tottenham": "熱刺",

  "Real Madrid": "皇家馬德里",
  "Barcelona": "巴塞隆納",
  "Atletico Madrid": "馬德里競技",

  "Bayern Munich": "拜仁慕尼黑",
  "Borussia Dortmund": "多特蒙德",

  "Inter": "國際米蘭",
  "AC Milan": "AC米蘭",
  "Juventus": "尤文圖斯",

  "Paris Saint Germain": "巴黎聖日耳曼"
};

function getTeamNameZH(name) {
  return teamNameZH[name] || name;
}
async function loadTomorrowFixtures() {
  const container = document.getElementById("matchesContainer");

  container.innerHTML = `
    <div class="ai-note">
      正在取得明日真實賽事...
    </div>
  `;

  try {
    const response = await fetch(FIXTURES_URL, {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": FIXTURES_PUBLISHABLE_KEY,
        "Authorization": "Bearer " + FIXTURES_PUBLISHABLE_KEY
      },

      body: JSON.stringify({})
    });

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.error || "賽事讀取失敗");
    }

    const allowedLeagues = [
  { name: "Premier League", country: "England" },
  { name: "La Liga", country: "Spain" },
  { name: "Bundesliga", country: "Germany" },
  { name: "Serie A", country: "Italy" },
  { name: "Ligue 1", country: "France" }
];

const fixtures = (data.fixtures || []).filter(match =>
  allowedLeagues.some(league =>
    league.name === match.league?.name &&
    league.country === match.league?.country
  )
);

    if (fixtures.length === 0) {
      container.innerHTML = `
        <div class="ai-note">
          明日暫無符合條件的主要賽事。
        </div>
      `;
      return;
    }

    container.innerHTML = fixtures.map(match => {

      const gameTime = new Date(match.time);

      const time = gameTime.toLocaleTimeString(
        "zh-TW",
        {
          timeZone: "Asia/Taipei",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false
        }
      );

const leagueText = getLeagueNameZH(match.league.name || "");

      return `
        <div class="match-card">

          <div class="match-info">
            <div class="time">${time}</div>
            <div class="league">${leagueText}</div>
          </div>

          <div class="teams">

            <div class="team">
              <img
                class="team-logo"
                src="${match.home.logo || ""}"
                alt="${match.home.name}"
              >
              <div class="team-name">
                ${getTeamNameZH(match.home.name)}
              </div>
            </div>

            <div class="vs">VS</div>

            <div class="team">
              <img
                class="team-logo"
                src="${match.away.logo || ""}"
                alt="${match.away.name}"
              >
              <div class="team-name">
                ${getTeamNameZH(match.away.name)}
              </div>
            </div>

          </div>

          <div class="analysis">
            <div class="ai-status">
              ● AI READY
            </div>

            <button
              class="analysis-btn"
              onclick="openMatch(${match.fixtureId}, this)"
            >
              開始分析 →
            </button>
          </div>

        </div>
      `;
    }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="ai-note">
        ⚠️ 賽事資料讀取失敗，請稍後再試。
      </div>
    `;
  }
}

function resetAnalysisButtons() {
  document.querySelectorAll(".analysis-btn").forEach(button => {
    clearInterval(button._progressTimer);
    button.disabled = false;
    button.textContent = "開始分析 →";
    button.classList.remove("loading");
    button.style.removeProperty("--progress");
    delete button.dataset.originalText;
  });
}

window.addEventListener("pageshow", () => {
  resetAnalysisButtons();

  setTimeout(() => {
    resetAnalysisButtons();
  }, 300);
});
  
// 頁面開啟後自動取得賽事
loadTomorrowFixtures();
</script>
