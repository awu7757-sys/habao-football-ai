<html lang="zh-Hant">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a0f">
  <title>HABAO AI｜讓數據先說話</title>
  <meta name="description" content="HABAO AI 賽事預測分析｜免費探索足球、NBA、MLB 賽事資料。信號不足，不勉強推薦。">
  <meta property="og:title" content="HABAO AI｜讓數據先說話">
  <meta property="og:description" content="不是每場比賽，都值得推薦。免費開始・低信心不硬推・結果公開驗證。">
  <meta property="og:image" content="https://hbai-tw.pages.dev/habao-og-20261013.png">
  <link rel="icon" href="../habao-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Cinzel:wght@900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070a0f;--gold:#f2bd4b;--gold-light:#ffe7a8;--text:#f7f3e8;--muted:#aab2bf;
      --gold-grad:linear-gradient(180deg,#fff3c4 0%,#f6cf6a 28%,#d99821 55%,#f2bd4b 72%,#8a5a12 100%);
      --frame:linear-gradient(145deg,#fff1b8,#c98a1f 30%,#6b4410 52%,#f2c35a 75%,#8a5a12);
      --u:min(1svh,1.9vw + .3svh); /* 依螢幕高度縮放的單位，確保一頁放得下 */
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;color:var(--text);
      background:
        radial-gradient(120% 55% at 50% -10%,rgba(242,189,75,.17),transparent 60%),
        radial-gradient(90% 50% at 50% 60%,rgba(30,52,88,.35),transparent 70%),
        repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 2px,transparent 2px 14px),var(--bg);
      overflow:hidden;-webkit-tap-highlight-color:transparent;
    }
    a{color:inherit;text-decoration:none}
    .page{
      height:100svh;max-width:480px;margin:0 auto;
      padding:calc(env(safe-area-inset-top) + var(--u)*2.2) 16px calc(env(safe-area-inset-bottom) + var(--u)*1.6);
      display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*3.2);
    }

    /* 品牌列 */
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:calc(var(--u)*.6)}
    .brand img{width:calc(var(--u)*6.4);height:calc(var(--u)*6.4);filter:drop-shadow(0 0 14px rgba(242,189,75,.4)) drop-shadow(0 6px 10px rgba(0,0,0,.7));animation:float 5s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-3px)}}
    .brand-name{font-family:"Cinzel",serif;font-weight:900;font-size:calc(var(--u)*3);letter-spacing:.06em;line-height:1;
      background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #4a2e08)}
    .brand-sub{font-size:calc(var(--u)*1.35);font-weight:700;letter-spacing:.2em;color:var(--gold-light);margin-top:3px}

    /* 金框 */
    .framed{position:relative;border-radius:20px;padding:2px;background:var(--frame);box-shadow:0 10px 24px rgba(0,0,0,.6),0 0 18px rgba(242,189,75,.16)}
    .framed>.inner{position:relative;border-radius:18px;overflow:hidden;
      background:linear-gradient(160deg,rgba(255,255,255,.06),transparent 40%),repeating-linear-gradient(120deg,rgba(255,255,255,.022) 0 18px,transparent 18px 36px),linear-gradient(180deg,#151e2b,#0b1018 85%);
      box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -6px 14px rgba(0,0,0,.55)}

    /* 主視覺 */
    .hero .inner{padding:calc(var(--u)*3.4) 18px;text-align:center}
    .hero .inner::before{content:"";position:absolute;inset:-60% -30% auto;height:220%;
      background:conic-gradient(from 200deg,transparent 0 40%,rgba(255,231,168,.15) 48%,transparent 56%);animation:sweep 7s linear infinite;pointer-events:none}
    @keyframes sweep{to{transform:rotate(360deg)}}
    .kicker{position:relative;font-size:calc(var(--u)*1.3);font-weight:700;letter-spacing:.3em;color:var(--gold)}
    h1{position:relative;margin:calc(var(--u)*1.2) 0;font-size:calc(var(--u)*4.4);font-weight:900;line-height:1.22;letter-spacing:.03em;
      text-shadow:0 3px 8px rgba(0,0,0,.85)}
    h1 em{font-style:normal;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
      filter:drop-shadow(0 2px 0 #3d2506);text-shadow:none}
    .lead{position:relative;font-size:calc(var(--u)*1.75);color:#e3e6ec;line-height:1.6}
    .lead b{color:var(--gold-light)}

    /* 三原則 */
    .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .pillar{border-radius:16px;padding:2px;box-shadow:0 5px 0 rgba(0,0,0,.55),0 10px 18px rgba(0,0,0,.5)}
    .pillar>div{height:100%;border-radius:14px;padding:calc(var(--u)*2.2) 8px calc(var(--u)*2);text-align:center;
      box-shadow:inset 0 2px 0 rgba(255,255,255,.14),inset 0 -6px 12px rgba(0,0,0,.55)}
    .pillar .ic{width:calc(var(--u)*5.8);height:calc(var(--u)*5.8);margin:0 auto calc(var(--u)*.9);border-radius:50%;display:grid;place-items:center;
      box-shadow:inset -3px -5px 8px rgba(0,0,0,.45),0 5px 10px rgba(0,0,0,.7)}
    .pillar .ic svg{width:52%;height:52%}
    .pillar h3{font-size:calc(var(--u)*1.75);font-weight:900;letter-spacing:.04em;white-space:nowrap}
    .pillar p{font-size:calc(var(--u)*1.25);color:var(--muted);line-height:1.45;margin-top:4px}
    .p-gold{background:linear-gradient(145deg,#fff1b8,#c98a1f 35%,#6b4410 60%,#f2c35a)}
    .p-gold>div{background:linear-gradient(180deg,#2a2414,#0f0d08)}
    .p-gold .ic{background:radial-gradient(circle at 35% 30%,#fff7da,#f2bd4b 45%,#7a4c0e)}
    .p-blue{background:linear-gradient(145deg,#cfe3ff,#3d6fb8 35%,#1a2f55 60%,#6f9be0)}
    .p-blue>div{background:linear-gradient(180deg,#14233d,#0a111d)}
    .p-blue .ic{background:radial-gradient(circle at 35% 30%,#e6f0ff,#5b8fd8 45%,#1c3560)}
    .p-green{background:linear-gradient(145deg,#c9ffe0,#2f9c66 35%,#124a31 60%,#5fd496)}
    .p-green>div{background:linear-gradient(180deg,#112a22,#09140f)}
    .p-green .ic{background:radial-gradient(circle at 35% 30%,#e3fff0,#3cdd82 45%,#145a37)}

    /* 流程 */
    .flow{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
    .step{display:flex;align-items:center;gap:8px}
    .medal{width:calc(var(--u)*4);height:calc(var(--u)*4);border-radius:50%;display:grid;place-items:center;
      font-family:"Cinzel",serif;font-weight:900;font-size:calc(var(--u)*1.9);color:#2b1a03;
      background:radial-gradient(circle at 35% 30%,#fff7da,#f2bd4b 50%,#8a5a12);box-shadow:inset 0 -3px 5px rgba(0,0,0,.35),0 3px 0 #5a3a0c,0 0 14px rgba(242,189,75,.35)}
    .step b{display:block;font-size:calc(var(--u)*1.7);font-weight:900}
    .step small{display:block;font-size:calc(var(--u)*1.15);color:var(--muted)}
    .link{flex:1;height:2px;margin:0 8px;background:linear-gradient(90deg,rgba(242,189,75,.1),rgba(242,189,75,.9),rgba(242,189,75,.1));box-shadow:0 0 8px rgba(242,189,75,.6)}

    .foot{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2)}
    .back{font-size:calc(var(--u)*1.45);font-weight:700;color:var(--gold-light);opacity:.85;letter-spacing:.06em;padding:6px 10px}
    .back:active{opacity:.6}
    .note{text-align:center;font-size:calc(var(--u)*1.05);color:#7d8593;line-height:1.5}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
  <main class="page">

    <header class="brand">
      <img src="../habao-hb-logo.png" alt="HB 標誌">

    </header>

    <section class="framed hero">
      <div class="inner">
        <div class="kicker">HABAO AI ENGINE</div>
        <h1>不是每場比賽，<br><em>都值得推薦。</em></h1>
        <p class="lead">整合賽事資訊與多維數據，<br>讓每一次分析都有所本。<br><b>知道何時不建議，同樣重要。</b></p>
      </div>
    </section>

    <section class="pillars" aria-label="我們的原則">
      <div class="pillar p-gold"><div>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2b1a03" stroke-width="2.4" stroke-linecap="round"><path d="M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7H7.5a2.5 2.5 0 110-5C11 2 12 7 12 7zm0 0h4.5a2.5 2.5 0 100-5C13 2 12 7 12 7z"/></svg></div>
        <h3>免費開始</h3><p>不必先買高額月費</p>
      </div></div>
      <div class="pillar p-blue"><div>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#06142a" stroke-width="2.4" stroke-linecap="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg></div>
        <h3>低信心不硬推</h3><p>信號不足不推薦</p>
      </div></div>
      <div class="pillar p-green"><div>
        <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#04200f" stroke-width="2.4" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></div>
        <h3>結果公開驗證</h3><p>賽後回頭檢視成績</p>
      </div></div>
    </section>

    <section class="flow" aria-label="運作方式">
      <div class="step"><span class="medal">1</span><div><b>蒐集</b><small>賽程・表現・市場</small></div></div>
      <span class="link"></span>
      <div class="step"><span class="medal">2</span><div><b>分析</b><small>量化模型</small></div></div>
      <span class="link"></span>
      <div class="step"><span class="medal">3</span><div><b>篩選</b><small>有依據才推薦</small></div></div>
    </section>

    <footer class="foot">
      <p class="note">本站為賽事數據分析資訊介紹；模型結果存在不確定性，不構成獲利保證或投注建議。</p>

    </footer>

  </main>
</body>
