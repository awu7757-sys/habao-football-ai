<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>哈寶足球 AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 20%, rgba(45,255,153,.13), transparent 32%),
        radial-gradient(circle at 80% 80%, rgba(30,122,255,.16), transparent 35%),
        linear-gradient(135deg, #050b12 0%, #091522 48%, #05090f 100%);
      overflow: hidden;
    }

    .field {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .08;
    }

    .field::before {
      content: "";
      position: absolute;
      width: 700px;
      height: 700px;
      border: 1px solid #75ffb8;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }

    .field::after {
      content: "";
      position: absolute;
      width: 1px;
      height: 100%;
      background: #75ffb8;
      left: 50%;
    }

    .app {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      z-index: 2;
    }

    .login-wrap {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(45,255,153,.22), rgba(45,255,153,.05));
      border: 1px solid rgba(96,255,176,.28);
      box-shadow: 0 0 35px rgba(34,255,137,.12);
      font-size: 36px;
    }

    .brand-small {
      color: #5dffab;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .brand h1 {
      font-size: 34px;
      font-weight: 800;
    }

    .brand p {
      color: #8997a8;
      font-size: 14px;
      margin-top: 9px;
    }

    .card {
      background: linear-gradient(160deg, rgba(17,31,44,.9), rgba(8,18,27,.9));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 26px;
      padding: 34px 30px 30px;
      backdrop-filter: blur(22px);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .card-subtitle {
      color: #718092;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .label {
      display: block;
      color: #aab5c1;
      font-size: 12px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 56px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,.09);
      background: rgba(0,0,0,.22);
      color: #fff;
      padding: 0 17px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: rgba(66,255,160,.55);
      box-shadow: 0 0 0 3px rgba(41,255,144,.07);
    }

    button {
      width: 100%;
      height: 56px;
      margin-top: 18px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      color: #03130b;
      background: linear-gradient(90deg, #35ed8a, #66ffb0);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 13px;
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    .error {
      display: block;
      color: #ff9c9c;
      border: 1px solid rgba(255,94,94,.16);
      background: rgba(255,63,63,.06);
    }

    .success {
      display: block;
      color: #6dffb5;
      border: 1px solid rgba(66,255,160,.18);
      background: rgba(66,255,160,.06);
    }

    .security {
      margin-top: 23px;
      text-align: center;
      color: #526171;
      font-size: 11px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #3f4d5a;
      font-size: 10px;
      letter-spacing: 1px;
    }

    @media (max-width: 520px) {
      .card {
        padding: 29px 22px;
      }

      .brand h1 {
        font-size: 29px;
      }
    }
  /* ===== 登入頁下方快捷按鈕 ===== */

.login-shortcuts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
  width:100%;
}

.shortcut-card{
  min-width:0;
  width:100%;
  min-height:92px;
  padding:16px 14px;
  border-radius:20px;
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  cursor:pointer;
  box-sizing:border-box;
  background:rgba(8,22,32,.88);
  font-family:inherit;
}

.line-card{
  border:1px solid #20e98a;
  box-shadow:0 0 20px rgba(32,233,138,.10);
}

.benefit-card{
  border:1px solid #d9a928;
  color:inherit;
  appearance:none;
  text-align:left;
}

.shortcut-icon{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#20e98a;
  color:#07140f;
  font-size:11px;
  font-weight:900;
}

.gift-icon{
  background:transparent;
  font-size:30px;
}

.shortcut-content{
  flex:1;
  min-width:0;
}

.shortcut-title{
  color:#35f2a0;
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
}

.benefit-card .shortcut-title{
  color:#f4c542;
}

.shortcut-sub{
  color:#a5b1bd;
  font-size:12px;
  margin-top:5px;
  white-space:nowrap;
}

.shortcut-arrow{
  color:#fff;
  font-size:28px;
  line-height:1;
}

@media(max-width:480px){
  .login-shortcuts{
    gap:8px;
  }

  .shortcut-card{
    min-height:82px;
    padding:12px 10px;
    gap:8px;
    border-radius:17px;
  }

  .shortcut-icon{
    width:38px;
    height:38px;
    flex-basis:38px;
    font-size:9px;
  }

  .gift-icon{
    font-size:25px;
  }

  .shortcut-title{
    font-size:14px;
  }

  .shortcut-sub{
    font-size:10px;
  }

  .shortcut-arrow{
    font-size:22px;
  }
}
  </style>
</head>

<body>

  <div class="field"></div>

  <main class="app">

    <div class="login-wrap">

      <div class="brand">
        <div class="logo">⚽</div>
        <div class="brand-small">HABAO FOOTBALL AI</div>
        <h1>哈寶足球 AI</h1>
        <p>AI 智能賽事數據分析平台</p>
      </div>

      <section class="card">

        <div class="card-title">會員登入</div>

        <div class="card-subtitle">
          請輸入哈寶提供的授權帳號進入分析系統
        </div>

        <label class="label">使用帳號</label>

        <input
          id="account"
          type="text"
          placeholder="請輸入會員帳號"
          autocomplete="off"
        >

        <button id="loginBtn" onclick="login()">
          進入分析系統 →
        </button>

        <div id="message" class="message"></div>

        <div class="security">
          ● 僅限授權會員使用
        </div>

      </section>

<div class="login-shortcuts">

  <a
    class="shortcut-card line-card"
    href="https://lin.ee/ppRvZLM"
    target="_blank"
    rel="noopener noreferrer"
  >
    <div class="shortcut-icon">LINE</div>

    <div class="shortcut-content">
      <div class="shortcut-title">領取AI帳號</div>
      <div class="shortcut-sub">加入官方 LINE</div>
    </div>

    <div class="shortcut-arrow">›</div>
  </a>


  <button
    type="button"
    class="shortcut-card benefit-card"
    onclick="openBenefits()"
  >
    <div class="shortcut-icon gift-icon">🎁</div>

    <div class="shortcut-content">
      <div class="shortcut-title">本站福利</div>
      <div class="shortcut-sub">查看最新活動</div>
    </div>

    <div class="shortcut-arrow">›</div>
  </button>

</div>

    </div>

  </main>

  <script>

    // ① 等一下貼 Supabase Function 網址
    const FUNCTION_URL = "https://oqtbsbohcfeghgnykwxy.supabase.co/functions/v1/member-login";

    // ② 等一下貼剛才複製的 Publishable Key
    const PUBLISHABLE_KEY = "sb_publishable_q6zWQwsHeH5HKQTDj561vQ_VyvmMwSH";


    async function login() {

      const input = document.getElementById("account");
      const button = document.getElementById("loginBtn");
      const message = document.getElementById("message");

      const account = input.value.trim();

      if (!account) {
        showError("請先輸入會員帳號");
        return;
      }

      button.disabled = true;
      button.innerText = "正在驗證會員資格...";

      message.style.display = "none";

      try {

        const response = await fetch(FUNCTION_URL, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": PUBLISHABLE_KEY,
            "Authorization": "Bearer " + PUBLISHABLE_KEY
          },

          body: JSON.stringify({
            account: account
          })
        });

        const data = await response.json();

        if (data.success) {

          message.className = "message success";
          message.innerHTML = "✓ 驗證成功，正在進入系統...";
          message.style.display = "block";

          sessionStorage.setItem(
            "habao_member",
            JSON.stringify(data.member)
          );

          setTimeout(() => {
            window.location.href = "home.html";
          }, 800);

          return;
        }

        if (data.code === "ACCOUNT_EXPIRED") {
          showError(
            "您的使用權限已到期<br>請聯絡哈寶"
          );
        }

        else if (data.code === "ACCOUNT_DISABLED") {
          showError(
            "此帳號目前無法使用<br>請聯絡哈寶"
          );
        }

        else if (data.code === "ACCOUNT_NOT_FOUND") {
          showError(
            "查無此授權帳號"
          );
        }

        else {
          showError(
            data.message || "登入失敗，請稍後再試"
          );
        }

      }

      catch (error) {

        console.error(error);

        showError(
          "系統連線失敗，請稍後再試"
        );

      }

      finally {

        button.disabled = false;
        button.innerText = "進入分析系統 →";

      }

    }


    function showError(text) {

      const message =
        document.getElementById("message");

      message.className =
        "message error";

      message.innerHTML = text;

      message.style.display =
        "block";

    }


    document
      .getElementById("account")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {
            login();
          }

        }
      );

  </script>

</body>
</html>
